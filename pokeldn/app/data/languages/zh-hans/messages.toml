"run native ARM code on the console through CLI_RUN_BUFFER_SCRIPT instead of sending a gift: trainer-id-probe: read playerTrainerId out of gSaveBlock2Ptr and return it (reads only, writes nothing); save-dump: read out any part of either save block, using the pointers the console hands us - no absolute address needed (reads only, writes nothing); memory-dump: read out any region of the console's memory by repointing the console's own outgoing message at it (needs --dump-address; reads only, writes nothing); memory-dump-multi: the same, but SEVERAL consecutive blocks in one session (--dump-address --dump-blocks N): the client script runs the payload once per block and each pass sends the next kilobyte; memory-dump-scatter: the same, but the blocks are UNRELATED addresses (--dump-scatter A,B,C): the payload carries a table of bases and the cursor indexes it, so one session reads the sixteen kilobytes a plan actually asked for rather than sixteen consecutive ones; save-write: write bytes into a save block and read the same region back in the same run; the console saves afterwards, so the write reaches flash (--write-hex, --dump-block, --dump-offset); rng-trace: sample one word of memory once a frame, optionally calling a ROM function between the two halves of each sample, and check the LCG recurrence on what comes back (--trace-address, --trace-call, --trace-samples; reads only, plus whatever the callee does); memory-scan: search memory for a 32-bit value and send back where it is; it returns 0 to be called again next frame, so one run covers a range no dump could (--scan-word, --scan-start, --scan-end, --scan-blocks; reads only, writes nothing); table-scan: search memory for a table by its shape, a run of N words each exactly D above the one before it, and send back where each run starts and what value it starts with; this is how a table of pointers is found when no constant in it is known (--table-delta, --table-runlen, --table-start, --table-end, --table-blocks; reads only, writes nothing); rom-checksum: checksum a range of memory in up to 128 blocks and send back one sum per block; the host sets them beside the same sums over a ROM image and names the blocks that differ (--sum-start, --sum-end, --sum-block, --sum-budget, --sum-reference; reads only, writes nothing); anchors: ask the machine where it is: our own load address, the return address into ROM, the stack and the client's five buffers (writes only its own outgoing buffer); create-mon: call CreateMon, a ROM function taking eight arguments, and send back the 100-byte struct Pokemon it built; the mon is built inside our own image, so nothing on the console is written unless --create-mon-append or --create-mon-destination asks for it (--create-mon-call, --create-mon-species, --create-mon-level, --create-mon-personality); string-gather: follow an array of pointers and send back the strings themselves, back to back, instead of a window of mostly-pointers: a whole Easy Chat group in one run (--gather-address, --gather-count, --gather-stride; reads only, writes nothing); call: call any ROM function with arguments we choose, up to eight words in r0..r3 then the stack, and send back its r0 with one address read either side of the call (--call-address, --call-arg, --call-watch); the payload writes nothing itself, but the callee may, so the address has to have been read as code first; flash-read: select the flash bank, byte-copy a save sector out of the 64 KiB window into EWRAM with the CPU, and send the COPY: the console's outgoing message cannot be pointed at flash itself (--flash-sector, --flash-read-offset, --dump-size; reads only, writes nothing); flash-patch: read a save sector out of flash through the banked window, change one field, recompute the checksum and write it back with swi 0x48, then bump the counter-bearing sector so the loader adopts the band. Nothing is rebuilt from RAM, so a field the save routine serializes cannot be lost (--flash-id, --flash-patch-offset, --flash-patch-hex; needs --write-unsafe); flash-write: compose 4 KB in EWRAM on the console and write it straight into a flash sector with swi 0x48, bypassing the game's save code entirely - no counter, checksum or signature (--flash-sector, --flash-fill-base, --flash-fill-step, --flash-words; a sector inside the save bands needs --write-unsafe); call-chain: run a LIST of ROM calls and memory accesses in one frame and send back a word for each, any step able to use the previous step's result as its address - which is how a function that returns a pointer (GetVarPointer) becomes a write (--chain-step, repeatable; a write step needs --write-unsafe); sloop-svc: issue one Sloop syscall (swi 0x40..0x62) with r0..r3 we choose, optionally pointing r0 or r1 at up to 256 bytes we send, and send back the registers and the bytes as the syscall left them (--svc-number, --svc-arg, --svc-text/--svc-hex, --svc-data-in; a number outside the read-only set needs --write-unsafe); install-resident: copy a resident hook into the top of EWRAM and install it in gIntrTable[4], where it runs every frame until a soft reset; answers with the V-blank handler it found (--resident turbo, --resident-param extra=N field=N battle=N hold=0x100 budget=228; needs --write-unsafe); install-kept: install the resident hook kept in the save's filler_B20 (written by save-write --resident), after checking its sum; answers with the V-blank handler it found, 0xBAD0BAD0 when nothing was installed" = "通过 CLI_RUN_BUFFER_SCRIPT 在游戏机上运行原生 ARM 代码，而不是发送礼物：trainer-id-probe：从 gSaveBlock2Ptr 读出 playerTrainerId 并返回（只读，不写入）；save-dump：读出两个存档块中任意一块的任意部分，使用游戏机交给我们的指针——无需绝对地址（只读，不写入）；memory-dump：通过把游戏机自己发出的消息重新指向目标，读出游戏机内存的任意区域（需要 --dump-address；只读，不写入）；memory-dump-multi：同上，但在一个会话中读取多个连续的块（--dump-address --dump-blocks N）：客户端脚本对每个块运行一次载荷，每趟发送下一个千字节；memory-dump-scatter：同上，但各块是互不相关的地址（--dump-scatter A,B,C）：载荷携带一张基址表，游标对其索引，因此一个会话读取的是计划真正要求的那十六个千字节，而不是十六个连续的千字节；save-write：把字节写入存档块，并在同一次运行中把同一区域读回；游戏机随后会存档，因此写入会落到 flash（--write-hex、--dump-block、--dump-offset）；rng-trace：每帧采样一个内存字，可选地在每次采样的两半之间调用一个 ROM 函数，并对返回的结果检查 LCG 递推（--trace-address、--trace-call、--trace-samples；只读，外加被调用方所做的一切）；memory-scan：在内存中搜索一个 32 位值并回传其所在位置；它返回 0 表示下一帧再被调用，因此一次运行可覆盖任何 dump 都无法覆盖的范围（--scan-word、--scan-start、--scan-end、--scan-blocks；只读，不写入）；table-scan：按形状在内存中搜索一张表，即 N 个字组成一串、每个字恰好比前一个大 D，并回传每串的起始位置以及该串的起始值；当表中没有任何已知常量时，指针表就是这样被找到的（--table-delta、--table-runlen、--table-start、--table-end、--table-blocks；只读，不写入）；rom-checksum：对一段内存计算校验和，最多 128 个块，每块回传一个和；主机把这些和与对 ROM 映像做同样计算得到的和并列比对，并指出不同的块（--sum-start、--sum-end、--sum-block、--sum-budget、--sum-reference；只读，不写入）；anchors：询问机器自身的位置：我们自己的加载地址、返回 ROM 的地址、栈以及客户端的五个缓冲区（只写入它自己的发送缓冲区）；create-mon：调用 CreateMon 这个接受八个参数的 ROM 函数，并回传它构造出的 100 字节 struct Pokemon；该宝可梦是在我们自己的映像内构造的，因此除非 --create-mon-append 或 --create-mon-destination 要求，游戏机上不会写入任何东西（--create-mon-call、--create-mon-species、--create-mon-level、--create-mon-personality）；string-gather：跟随一个指针数组，回传字符串本身、首尾相接，而不是一个几乎全是指针的窗口：一次运行取回整个 Easy Chat 组（--gather-address、--gather-count、--gather-stride；只读，不写入）；call：以我们选定的参数调用任意 ROM 函数，最多八个字，先放在 r0..r3 再放到栈上，并在调用前后各读一个地址，回传其 r0（--call-address、--call-arg、--call-watch）；载荷自身不写入，但被调用方可能会写，因此该地址必须事先已被当作代码读取过；flash-read：选择 flash bank，用 CPU 把存档扇区按字节从 64 KiB 窗口中拷贝到 EWRAM，然后回传这份拷贝：游戏机发出的消息无法直接指向 flash（--flash-sector、--flash-read-offset、--dump-size；只读，不写入）；flash-patch：通过分 bank 窗口从 flash 读出一个存档扇区，改动一个字段，重新计算校验和并用 swi 0x48 写回，然后递增带计数器的扇区，好让加载器采用该 band。没有任何东西从 RAM 重建，因此存档例程会序列化的字段不会丢失（--flash-id、--flash-patch-offset、--flash-patch-hex；需要 --write-unsafe）；flash-write：在游戏机的 EWRAM 中拼出 4 KB，并用 swi 0x48 直接写入 flash 扇区，完全绕过游戏的存档代码——不写计数器、校验和或签名（--flash-sector、--flash-fill-base、--flash-fill-step、--flash-words；位于存档 band 内的扇区需要 --write-unsafe）；call-chain：在一帧内运行一串 ROM 调用和内存访问，并为每一步回传一个字，任何一步都可以把上一步的结果用作自己的地址——返回指针的函数（GetVarPointer）就是这样变成一次写入的（--chain-step，可重复；写入步骤需要 --write-unsafe）；sloop-svc：发起一次 Sloop 系统调用（swi 0x40..0x62），r0..r3 由我们选定，可选地把 r0 或 r1 指向我们发送的最多 256 字节，并按系统调用留下的状态回传寄存器和这些字节（--svc-number、--svc-arg、--svc-text/--svc-hex、--svc-data-in；只读集合之外的编号需要 --write-unsafe）；install-resident：把一个常驻钩子拷贝到 EWRAM 顶部，并安装到 gIntrTable[4]，它会在那里每帧运行，直到软复位；以它找到的 V-blank 处理程序作为回应（--resident turbo、--resident-param extra=N field=N battle=N hold=0x100 budget=228；需要 --write-unsafe）；install-kept：在核对总和之后，安装保存在存档 filler_B20 中的常驻钩子（由 save-write --resident 写入）；以它找到的 V-blank 处理程序作为回应，若未安装任何东西则为 0xBAD0BAD0"
"run the game's port-2 opening from the station ids instead of a replay: the type-7 announcement on 0x80 port 2 carrying this host's own station id, and a type 9 carrying the console's in answer to its type-3 join on 0x7c port 2 (pokeldn.sv.port2)" = "用站点 id 现场构造游戏的端口 2 开场，而不是重放：在 0x80 端口 2 上发送携带本主机自身站点 id 的类型 7 通告，并在 0x7c 端口 2 上针对游戏机的类型 3 加入发送携带其站点 id 的类型 9 作答（pokeldn.sv.port2）"
