"end a seat whose console has not announced on 0x80 port 2 this many seconds after the seat, and go back to scanning. A seat can carry every stream to completion and never be announced (docs/sv.md, Unresolved); board seats that traded announced at 5.8 and 7.7 s" = "在安排栏位之后，若游戏机在该时长内仍未在 0x80 端口 2 上宣告，就结束该栏位并返回扫描。一个栏位可以承载所有流直到完成却始终未被宣告（docs/sv.md, Unresolved）；已完成交换的开发板栏位分别在 5.8 秒和 7.7 秒时宣告"
"end the seat this many seconds after the console asks us to take the host role (Session type 7), and go back to scanning. A console that sent it sent nothing but NetStartHostMigration afterwards in the seats measured; without this the run holds the seat for the whole --hold" = "在游戏机要求我们接管主机角色（Session 类型 7）之后这么多秒结束本座位，并回到扫描状态。在实测的座位中，发出该请求的游戏机此后只发过 NetStartHostMigration；若不设置此项，运行会一直占着座位直到整个 --hold 结束"
