"destination bitmap word, big-endian at wire[9]; the console drops a message unless the bit for its own station index (1) is set, so bit 1 = 0x2" = "目标位图字，在 wire[9] 处按大端存放；除非游戏机自己站点索引（1）对应的位被置位，否则它会丢弃消息，因此 bit 1 = 0x2"
"destination-bit count on the host's reliable message; 2 so the console's own station index (1) is in range of the body destination-bitmap check" = "主机可靠消息中的目的地位数；取 2 可让游戏机自身的站点索引（1）落在主体目的地位图检查的范围内"
"diagnostic: consecutive polls the opening SEND_PLAYER_IDS burst occupies before the LinkPlayer block request; default is the built-in timing" = "诊断项：开场 SEND_PLAYER_IDS 突发在 LinkPlayer 块请求之前占用的连续轮询次数；默认使用内置时序"
"diagnostic: idle VBlanks between the blocks of one Mystery Gift message; raise it if a run stalls part-way through a message (default is the built-in timing)" = "诊断项：一条神秘礼物消息各块之间空等的 VBlank 数；若运行在消息中途卡住就调大（默认使用内置时序）"
"diagnostic: quiet child polls after LinkPlayer standby before the first Mystery Gift message; default is the built-in timing" = "诊断用：在第一条神秘礼物消息之前，让子进程轮询安静下来等待 LinkPlayer 就绪；默认使用内置的时序"
"diagnostic: quiet console polls after the LinkPlayer exchange before the leader starts the trainer-card exchange itself" = "诊断用：在 LinkPlayer 交换之后、由队长自行开始训练家卡片交换之前，让游戏机轮询安静下来"
