"seconds after acceptance before the first data message, so the mesh join and the RTT exchange are already running when it lands" = "接受之后到第一条数据消息之间的秒数，使这条消息到达时 mesh 加入与 RTT 交换已经在进行"
"seconds after our identity to announce them" = "在我方身份之后多少秒宣告它们"
"seconds after the console's NetZoneData before the Underground join" = "游戏机的 NetZoneData 之后多少秒进行大地下世界的加入"
"seconds after the console's key-0x80 open at which the host offers first; the same gate as --send-on-open" = "游戏机以 key-0x80 打开之后多少秒主机先做提议；与 --send-on-open 是同一道闸门"
"seconds after the console's offer before the host's confirmation" = "游戏机提议之后经过多少秒由主机确认"
"seconds after the host's confirmation before the joiner commits; the pair's joiner committed 1.5 s after its own confirmation and its host answered in kind" = "主机的确认之后要过多少秒加入方才提交；这一对中的加入方在自己的确认后 1.5 秒提交，其主机也以同样方式回应"
"seconds after the host's confirmation before the joiner's own" = "主机确认之后经过多少秒由加入方自己确认"
"seconds after the host's key-0x80 open at which the joiner offers first, before the host does; without it the joiner answers the host's offer" = "主机在 key-0x80 上开启之后的第几秒由加入方先提议，抢在主机之前；不设此项时由加入方回应主机的提议"
"seconds after the identity before the selection record starts; a reference joiner waits about 0.46 s" = "身份之后到选择记录开始之间的秒数；参考加入方等待约 0.46 秒"
"seconds after the join response (after the seat without --session-join) before the eleven acks and the two stream opens go out; a retail joiner opens 0.75 s after its join" = "加入响应之后（未使用 --session-join 时则为获得席位之后）多少秒才发出那十一个 ack 与两个流的开启；零售加入方在其加入后 0.75 秒开启"
"seconds after the party clones to move our state word to 2 and send the offer, which is what a station does as its own state word reaches 2" = "队伍克隆之后多少秒把我方状态字移到 2 并发送提议，这正是站点在自身状态字到达 2 时的做法"
"seconds after the player's trade emote before our character approaches (no walk)" = "玩家的交换表情之后经过多少秒我方角色才靠近（不走路）"
"seconds after the seat at which the host offers first, before the console does, as a pair's host did; without it the host answers the console's offer" = "获得席位之后多少秒由主机先行提议、赶在游戏机之前，如同对局主机所做；不指定则主机只回应游戏机的提议"
"seconds after the seat before the first identity record goes out" = "座位建立之后多少秒发出第一条身份记录"
"seconds after the seat before the record set goes out" = "安排栏位之后经过多少秒发出记录集"
"seconds after the seat before the type 7 goes out; a pair's host sends it at about 2.3" = "安排栏位之后经过多少秒发出 type 7；成对交换中的主机约在 2.3 秒时发送"
"seconds after the second commit to send the result, the next trade's first slot, with two clones announced 0.5 s before it; a retail host sent it 26.8 s after, behind its trade animation" = "第二次提交之后多少秒发送结果，即下一次交换的第一个栏位，并在其之前 0.5 秒宣布两个克隆；一台零售主机在其交换动画之后、即 26.8 秒时才发送"
"seconds after the streams open before the offer goes out" = "各条流打开之后经过多少秒才发出提议"
"seconds after the take-over burst to publish our copy, with --publish-on-announce. Zero puts it in the burst's own frame" = "配合 --publish-on-announce，在接管突发之后经过这么多秒发布我们的副本。0 表示放在该突发自身的帧里"
"seconds after the walk before the first request" = "行走之后多少秒发出第一个请求"
"seconds between approach retransmissions" = "接近消息重传之间的秒数"
"seconds between one request landing and the next going out" = "一次请求抵达与下一次发出之间的秒数"
"seconds between our own RTT requests (0 sends none)" = "我方两次 RTT 请求之间的秒数（0 表示不发送）"
"seconds between position messages in the burst pattern. The default is the console's own median gap" = "突发模式中位置消息之间的秒数。默认值是游戏机自己的间隔中位数"
"seconds between repeats of our security-phase state, until the console reports SEND_READYOK. A CHILD console's SEND_READYOK only ends when a message arrives inside it" = "两次重复我方安全阶段状态之间的秒数，直到游戏机报告 SEND_READYOK。CHILD 游戏机的 SEND_READYOK 只有在其内部收到一条消息时才会结束"
"seconds between requests; the console answered BDSP's in 40 ms" = "请求之间的秒数；游戏机回应 BDSP 的请求只用了 40 ms"
"seconds between selection records; a reference joiner sends about four a second, each under a fresh sequence" = "选择记录之间的秒数；参考加入方每秒约发送四条，每条都在一个新的序列之下"
"seconds between the Session join response and the station-list update; a Scarlet host leaves about 1.5 s" = "会话加入响应与站点列表更新之间的秒数；一台朱版主机约在 1.5 秒时离开"
"seconds between the approach answer and each --after-approach message" = "接近应答与每一条 --after-approach 消息之间的秒数"
"seconds between the payloads of --reliable-payload" = "--reliable-payload 各载荷之间的秒数"
"seconds between the periodic bulk acks on every port the console used" = "游戏机用过的每个端口上，两次周期性批量确认之间的秒数"
"seconds between the periodic bulk acks on every stream the host uses" = "主机使用的每条流上，两次周期性批量确认之间的秒数"
"seconds between the queued post-offer payloads. Spread them so the sweep spans the accept: the console tears down on the accept, not on a timer, so commands sent inside a couple of seconds all land before it" = "排队发送的提议后载荷之间的秒数。把它们拉开，使扫描覆盖到接受那一刻：游戏机是在接受时拆除、而不是按定时器，因此几秒内发出的命令都会在拆除前送达"
"seconds between the record packets; a retail raid host spreads its identity over about 0.13 s" = "记录数据包之间的秒数；一台零售团体战主机会在约 0.13 秒内分发完其身份"
"seconds between the steps the host drives an offered clone through" = "主机把所提供的克隆体推进各个步骤之间的秒数"
"seconds between the talk answer and each --after-talk message" = "从回应交谈到每条 --after-talk 消息之间的秒数"
"seconds each fragment stays on the air" = "每个分片在空口上停留的秒数"
"seconds each sweep variant stays live" = "每种扫描变体保持生效的秒数"
"seconds in the raid lobby before our player readies" = "我方玩家准备之前，在团体战大厅中等待的秒数"
"seconds of listening before the first packet out, so the capture holds the console's own rate to compare against" = "在发出第一个包之前先监听多少秒，好让抓包中包含游戏机自己的速率以便对照"
"seconds past --connect-seconds or --hold to keep a seat whose trade is half done: a trade left mid-way locks the console out of trading" = "在 --connect-seconds 或 --hold 之后再保留多少秒，以保住交换只完成一半的席位：交换中途被打断会让游戏机无法再进行交换"
"seconds past --hold to keep a session whose trade is under way: the console has offered and the ladder has not finished" = "在 --hold 之后额外保留一个交换仍在进行的会话多少秒：此时游戏机已提议而阶梯尚未结束"
"seconds past --seconds to hold a session whose trade is half done" = "在 --seconds 之后，为交换只做了一半的会话继续占住的秒数"
"seconds per channel in a scan" = "扫描中每个信道停留的秒数"
"seconds per channel in the scan; 0.8 missed a live network twice" = "扫描时每个信道的秒数；0.8 曾两次错过一个在线网络"
"seconds per channel in the scan; the console's hosting window is a few seconds, so a long dwell misses it" = "扫描时每个信道的停留秒数；游戏机的主持窗口只有几秒，停留太久就会错过"
"seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own" = "允许关联本身所用的秒数；若某台游戏机的主机阶段在连接中途结束，会让 ldn.connect 阻塞，且其自身没有超时"
"seconds to wait after the console starts advertising before approaching" = "游戏机开始广播之后等待多少秒再去接近"
"seconds to wait for a reply; every probe gets one, so this is short" = "等待回复的秒数；每次探测都会得到回复，因此这个值很短"
"seconds without an update session that count as the rebroadcast stopping - the console sends ten a second, so this is fifteen missed" = "多久没有更新会话就算作重新广播已经停止——游戏机每秒发送十次，因此这相当于漏掉十五次"
"send APPLICATION DATA once the mesh is up - the first of the project. The payload as hex; \"610000000a00\" is the six bytes the console repeats at us on 0x7C. Nothing is sent without this flag" = "mesh 建立之后发送 APPLICATION DATA——这是本项目中的第一条。载荷以十六进制给出；\"610000000a00\" 就是游戏机在 0x7C 上反复发给我们的那六个字节。不带此开关则什么都不发"
"send N well-formed connection requests and report what comes back" = "发送 N 个格式正确的连接请求并报告收到的回应"
"send Session type 2 unicast before type 5 broadcast" = "在类型 5 广播之前发送 Session 类型 2 单播"
"send a version-9 station connection request to the host and classify the reply, retransmitting every 0.5 s the way Pia does. Without it, listen only" = "向主机发送版本 9 的站点连接请求并对回应进行分类，像 Pia 那样每 0.5 秒重传一次。不带此项时只监听"
"send an RTT request this often, as a pair's host does every 410 ms; the host otherwise only answers them" = "以这个频率发送一条 RTT 请求，如同对局主机每 410 毫秒所做的那样；否则主机只会回应这些请求"
"send back whatever the console last said on this protocol, rather than the fixed --send-data. --send-data is still the first payload, before the console has said anything" = "回发游戏机在此协议上最后所说的内容，而不是固定的 --send-data。--send-data 仍是第一个载荷，在游戏机尚未说任何内容之前发送"
"send each block fragment once (fire-and-forget) instead of the console's re-send-until-confirmed loop. Default off (faithful re-send): against the real client, a block streams in 1-2s with aggressive re-sends (~1.5x) and completes; trust_pia's send-once crawled (~0.1 frag/s) and never completed. trust_pia was a workaround for the 'flood', but that was the rtt deadlock (now fixed). --trust-pia re-enables send-once" = "每个块片段只发送一次（发后不管），而不采用游戏机反复重发直至确认的循环。默认关闭（忠实重发）：面对真实客户端，一个块在约 1.5 倍的重发强度下用 1-2 秒流式传完并完成；trust_pia 的只发一次方案极慢（约 0.1 片段/秒）且从未完成。trust_pia 曾是对「洪泛」的变通，但那其实是 rtt 死锁（现已修复）。--trust-pia 会重新启用只发一次"
"send every record the host puts on 0x81 port 0 back on port 1 as our own, in order. A retail joiner answers the host's records with a set of its own; this fills that set with records the game itself composed" = "把主机放在 0x81 端口 0 上的每一条记录按顺序在端口 1 上作为我方的记录回发。零售加入方会用它自己的一组记录回应主机的记录；此项用游戏本身编写的记录来填满这一组"
"send nat flags 5 and nat location 1. A Let's Go joiner sends zero for both on local wireless" = "发送 nat flags 5 和 nat location 1。Let's Go 的加入方在本地无线下两者都发 0"
"send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference" = "除非 --record-set 或 --send-on-open 指定了某个身份，否则不发送任何 station 身份；默认发送 pokeldn.sv.reference 中记录的那个"
"send our PK8 as a Data on elementId 10000 and as a holder on the 30000-base id (30050), which every content registers. More than one variable at once" = "把我方 PK8 作为 elementId 10000 上的一个 Data 发送，并作为 30000-base id（30050）上的一个持有者发送，后者每个内容都会注册。可一次设置多个变量"
"send our own 40050 pair the moment the console says id 130 pingSynced, before its own selection burst. nxldn-lab's client opens the selection phase this way and nothing here has ever opened one; the console sends 820000001a00 in our own captures 0.3 s before its 40050 burst" = "在游戏机表示 id 130 pingSynced 的那一刻、于它自己的选择突发之前，发送我们自己的 40050 对。nxldn-lab 的客户端就是这样开启选择阶段的，而这里的代码从未开启过；在我们自己的抓包中，游戏机在它的 40050 突发之前 0.3 秒发送 820000001a00"
"send the 0x3c-byte connection response instead of the full 0x348-byte one, which carries no network id and no player" = "发送 0x3c 字节的连接响应，而不是完整的 0x348 字节响应，后者不携带网络 id 也不携带玩家信息"
"send the Net 0x50 update-property message a pair's host sends 0.37 s after its 0x11, retransmitting until the console's 0x51" = "发送 Net 0x50 的 update-property 消息，一对中的主机在其 0x11 之后 0.37 秒发送它，并重传直到收到游戏机的 0x51"
"send the Pia Session join request in the retail layout (docs/sv.md, The Session join request): ten protocols with their versions, a four-byte nonce, both location ids, a seven-byte station address and one player record. A mesh join is unicast, so no passive capture shows a retail one" = "按零售版布局发送 Pia 会话加入请求（docs/sv.md，The Session join request）：十个协议及其版本、一个四字节 nonce、两个位置 id、一个七字节站点地址以及一条玩家记录。mesh 加入是单播的，因此被动抓包看不到零售版的加入请求"
"send the Session join request once the console's Net is acknowledged" = "游戏机的 Net 被确认之后再发送 Session 加入请求"
"send the Session join request with no Net 0x12 answer to the host's 0x11; the 0x12 is what a console answers by asking for host migration" = "发送会话加入请求，但不对主机的 0x11 回以 Net 0x12；0x12 正是游戏机请求主机迁移时所用的回应"
"send the announcement of our own copy a tick after the take-over burst. Both stations of a session that works put all seven in one frame, which is the default here" = "在接管突发之后一个 tick 发送我们自己那份的宣告。能正常工作的会话中，两个站点都把全部七条放在同一帧里，这也是此处的默认值"
"send the band's Net connection request once seated" = "入座后发送该 band 的 Net 连接请求"
"send the game's type-3 join on 0x7c port 2 with the channel table, rather than in answer to the console's type-7 announcement on 0x80 port 2. A pair's joiner answers the announcement (docs/sv.md, Port 2)" = "用信道表在 0x7c 端口 2 上发送游戏的 type-3 加入，而不是作为对游戏机在 0x80 端口 2 上 type-7 宣告的回应。成对交换中的加入方会回应宣告（docs/sv.md, Port 2）"
"send the host's own record on the 0x81 data exchange once the console opens its stream; the exchange the trade scene is the success branch of" = "在游戏机打开其流之后，在 0x81 数据交换上发送主机自己的记录；交换场景正是该交换的成功分支"
"send the offer under a new PID and encryption constant, shiny state kept, so a save that took this record before takes it again" = "用新的 PID 和加密常数发送提议，保留异色状态，使之前接受过这条记录的存档能再次接受"
"send the requests to the console rather than the broadcast address" = "把请求发给游戏机，而不是发往广播地址"
"send them to the broadcast address instead" = "改为把它们发往广播地址"
"send these box commands as soon as the console acks our 0x84 snapshot - BEFORE either side offers a Pokemon. The game sends command 3 exactly once, on the first frame after its trade session is built and only when the role bit at session+0x419 is clear (0x010c9bb0), so one of the two sides owes the other an opener before anything else happens. Sent after both offers instead, the console leaves while the player is still picking" = "游戏机确认我方 0x84 快照后立即发送这些电脑盒命令——在任一方提议宝可梦之前。游戏只发送命令 3 一次：在其交换会话建立后的第一帧，且仅当 session+0x419 处的角色位为清空时（0x010c9bb0），因此其中一方在其它任何事情发生之前欠对方一个开场动作。若改为在双方都提议之后发送，游戏机会在玩家仍在挑选时离开"
"send these box commands the moment MIGRATION_START arrives - the only signal that says the player pressed accept. The console keeps acking for about five seconds after it" = "在 MIGRATION_START 到达的那一刻发送这些电脑盒命令——这是唯一表明玩家按了接受的信号。此后游戏机会持续确认约五秒"
"send this 139-byte record file instead of building one" = "发送这个 139 字节的记录文件，而不是自行构建一个"
"send this directory's records as our own on 0x81 port 1, in sequence order, in place of --mirror-records. `scratchpad/sv_extract_records.py` writes one from a station's own log, so a whole real identity can be replayed rather than the host's mirrored back; by default the recorded set in pokeldn.sv.reference" = "在 0x81 端口 1 上按序列顺序把这个目录里的记录当作我们自己的记录发送，取代 --mirror-records。`scratchpad/sv_extract_records.py` 能从站点自身的日志生成一份，因此可以重放一个完整的真实身份，而不是把主机的身份镜像回来；默认使用 pokeldn.sv.reference 中记录的集合"
"send to the console rather than the broadcast address" = "发送到游戏机而不是广播地址"
"send to the host's address instead of the LDN broadcast address. Both retail stations broadcast every Pia packet (sv11), and a broadcast needs no ARP resolution of the peer" = "发送到主机的地址，而不是 LDN 广播地址。两个零售 station 都广播每个 Pia 数据包（sv11），而广播无需对端做 ARP 解析"
"serve the raid battle from this station with a plugin's battle server (NAME, or the first one loaded): the console and our Pokemon fight one battle; one console only; a failure hands the network over as without it (docs/sv_raid.md, Serving the battle)" = "由本站点用插件的对战服务器来承载团体战（NAME，或第一个已加载的）：游戏机与我们的宝可梦打一场对战；仅限一台游戏机；失败时网络会像没有它一样被移交 (docs/sv_raid.md, Serving the battle)"
"set a field of the League Card the console may keep after the trade (pokeldn.swsh.league_card: name, trainer_id, dex_owned, poke1_species, ...)" = "设置交换后游戏机可能保留的联盟卡字段（pokeldn.swsh.league_card：name、trainer_id、dex_owned、poke1_species 等）"
"set the adapter's MAC before associating, e.g. 48:f1:eb:11:22:33. Pia derives a station's constant id from its MAC, and the two consoles' are Nintendo OUIs where the adapter's is not. The driver reload in the launcher puts the adapter's own address back" = "在关联之前设置适配器的 MAC，例如 48:f1:eb:11:22:33。Pia 由站点的 MAC 推导其固定 id，两台游戏机的是任天堂 OUI，而适配器的不是。启动器中的驱动重载会把适配器自身的地址恢复"
"shared host TOML (default: config/host.toml)" = "共享主机 TOML（默认：config/host.toml）"
"shield" = "盾"
"shiny-hunting" = "shiny-hunting"
"show detailed protocol logging instead of milestones" = "显示详细的协议日志，而不是里程碑日志"
"six IVs 0 to 31 (default each random, as a wild one's)" = "六项个体值，0 到 31（默认每项随机，与野生宝可梦一样）"
"six IVs, comma-separated, in PKHeX's HP,ATK,DEF,SPE,SPA,SPD order" = "六个个体值，以逗号分隔，按 PKHeX 的 HP、ATK、DEF、SPE、SPA、SPD 顺序"
"sloop-svc" = "sloop-svc"
"snacksworth" = "snacksworth"
"solrock-stamp" = "solrock-stamp"
"spanish" = "西班牙语"
"speed-0-5" = "speed-0-5"
"speed-0-75" = "speed-0-75"
"speed-2" = "speed-2"
"speed-3" = "speed-3"
"speed-4" = "speed-4"
"square" = "square"
"square spawns one avatar per corner; line and fixed ask whether the game's idea of identity is the station or the position" = "方形方式在每个角落生成一个虚拟形象；line 与 fixed 用于检验游戏对身份的认定是依据站点还是依据位置"
"stamp our own clock on the take-over instead of the clock the peer's announcement carried. The peer completes a take-over only when it matches the sequence it allocated, so the echo is the default" = "在接管时盖上我们自己的时钟，而不是对端宣告中携带的时钟。对端只有在与之分配的序列匹配时才完成接管，所以默认是回显"
"standard" = "标准"
"starter-egg" = "starter-egg"
"stat-judge" = "stat-judge"
"stay silent after a join, to measure what the joiner does unprompted" = "加入之后保持静默，以测量加入方在无人提示的情况下会做什么"
"stay silent; the run then measures what the console sends on its own" = "保持静默；此时运行只测量游戏机自己发送的内容"
"steel" = "钢"
"stop after the post-delivery RFU close sequence; used by the supervised run_mystery_gift.sh host" = "在投递后的 RFU 关闭序列之后停止；由受监管的 run_mystery_gift.sh 主机使用"
"stop after this many seconds without meaningful Switch traffic (join or Pia/RFU datagram); default: disabled" = "在这么多秒内没有有效的 Switch 流量（加入或 Pia/RFU 数据报）后停止；默认：禁用"
"string-gather" = "string-gather"
"sword" = "剑"
"table-scan" = "table-scan"
"tera" = "太晶"
"test only, for bin/lgpe_join.py: act as a console host's player, each step this many seconds after the last. Offer unprompted after the party clones and after each result, vote on the offered clone, announce and vote the commit clone, commit (docs/lgpe_session.md). Never against a console" = "仅用于测试，适用于 bin/lgpe_join.py：扮演游戏机主机的玩家，每个步骤在上一步之后这么多秒执行。在队伍克隆之后以及每次结果之后主动提议，对提议的克隆投票，宣布并对提交的克隆投票，然后提交 (docs/lgpe_session.md)。切勿对真实游戏机使用"
"test only, for bin/swsh_connect.py: act as a console host's player: after a trade with another --offer-file queued, offer it from the box this many seconds after the ladder, without waiting for the joiner's offer" = "仅用于测试，供 bin/swsh_connect.py 使用：扮演游戏机主机的玩家：在一次交换之后若还排着另一个 --offer-file，则在阶梯结束后这么多秒从电脑盒里提供它，而不等待加入方的提议"
"test only: carry the drive on through a withdrawn vote, as the host did before it answered state 2 (docs/lgpe_session.md). Locks a console's save" = "仅用于测试：即使投票被撤回也继续推进该驱动序列，就像主机在回应 state 2 之前所做的那样（docs/lgpe_session.md）。会锁定游戏机的存档"
"test only: ignore the console's first answer to our clone 0 pair, as if lost, so the pair goes again" = "仅用于测试：忽略游戏机对我方克隆 0 对的第一次回应，如同丢失一样，使这一对再发一次"
"test only: send no answer to the host's first clone 0 pair (0xa1, 0xb1), as if lost, to see whether the host repeats it" = "仅用于测试：对主机的第一个克隆 0 对（0xa1、0xb1）不作回应，如同丢失一样，以观察主机是否会重发"
"test only: skip the first N of our announcements to the console alone, as if lost, so the resend carries them" = "仅用于测试：对我们发给游戏机的宣告跳过前 N 条，好像它们丢失了，从而由重发补上"
"test only: skip the first N of our announcements to the host alone, as if lost, so the resend carries them" = "仅用于测试：对我们发给主机的宣告跳过前 N 条，好像它们丢失了，从而由重发补上"
"the --raid-boss boss is Gigantamax; a retail console accepts it where a base den holds that Gigantamax Pokemon (docs/swsh_raid.md)" = "--raid-boss 指定的头目为超极巨化；只要某个基础巢穴能容纳该超极巨化宝可梦，零售游戏机就会接受它（docs/swsh_raid.md）"
"the 16-byte player id in the join request: 'arceus' (1 then 0 as two big-endian u64, what a retail Arceus states), 'random', 'high' (random with a leading 0xff) or 32 hex digits. A Scarlet host's own is 10047bd4a25543e057cee5c71ab1f2a2 (sv18)" = "加入请求中 16 字节的玩家 ID：'arceus'（依次为 1 和 0，作为两个大端 u64，即零售版 Arceus 所声明的值）、'random'、'high'（带前导 0xff 的随机值）或 32 个十六进制数字。Scarlet 主机自己的是 10047bd4a25543e057cee5c71ab1f2a2 (sv18)"
"the 354-byte offer message: the preview, then our pick. Repeatable, one per trade in the seat; the last serves every later trade" = "354 字节的提议消息：先是预览，然后是我们的选择。可重复，座位中每次交换一个；最后一个用于此后所有交换"
"the 41-byte Session join response a Scarlet host sends, with no route bytes, rather than Arceus's 43-byte one" = "Scarlet 主机发送的 41 字节 Session 加入响应，不含路由字节，而非 Arceus 的 43 字节响应"
"the BP, 1 to 9999999, --circle-task bp gives" = "BP，1 到 9999999，即 --circle-task bp 给出的值"
"the BattleSeed value; random by default" = "BattleSeed 值；默认随机"
"the LDN advertisement protocol. A title sees only its own: Let's Go advertises and scans on 1, measured off the console's own beacon" = "LDN 广播协议。一个游戏标题只能看到自己的：Let's Go 在 1 上广播与扫描，这是从游戏机自身信标测得的"
"the LDN application version; the console's own is unread" = "LDN 应用版本；游戏机自身的版本无法读取"
"the LDN node name" = "LDN 节点名称"
"the LDN node name we publish" = "我方发布的 LDN 节点名称"
"the LDN node name; a retail console publishes its profile name here" = "LDN 节点名；零售游戏机会在此发布其档案名"
"the LDN node name; a searching console advertises one space" = "LDN 节点名称；搜索中的游戏机会广播一个空格"
"the LDN participant limit; a Tera Raid advertises 4" = "LDN 参与者上限；太晶团体战宣告为 4"
"the LDN protocol the advertisement is encrypted for" = "该广播为其加密的 LDN 协议"
"the LDN scene id to seat in: 60001 a Link Trade search; any takes the first Sword network (a Max Raid den, docs/swsh_gift.md)" = "要加入的 LDN 场景 id：60001 为连接交换搜索；任意值则取第一个 Sword 网络（一个极巨团体战巢穴，docs/swsh_gift.md）"
"the LDN scene: 4 for a Link Trade, 7 for a Tera Raid" = "LDN 场景：4 用于连接交换，7 用于太晶团体战"
"the Link Code the player searches with, e.g. 12345678; none by default" = "玩家用于搜索的连接码，例如 12345678；默认没有"
"the Link Code the player sets, e.g. 12345678; empty for none" = "玩家所设置的连接码，例如 12345678；留空表示不用"
"the MAC we present; any value the host has not seen" = "我方呈现的 MAC；任意主机未见过的值"
"the Mystery Gift card each --offer and --next-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "每个 --offer 与 --next-offer 各自所依据的神秘卡片，顺序相同：其在 PKHeX 活动数据库中的键 (pokeldn.pokemon.Service.gift_events)"
"the Mystery Gift card each --offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "每个 --offer 所依据的神秘礼物卡片，顺序相同：它在 PKHeX 事件数据库中的键 (pokeldn.pokemon.Service.gift_events)"
"the Mystery Gift card each --trade-box-record was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "每个 --trade-box-record 所来自的神秘礼物卡片，顺序相同：它在 PKHeX 活动数据库中的键（pokeldn.pokemon.Service.gift_events）"
"the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "每个 --trade-offer 所依据的神秘礼物卡片，顺序相同：它在 PKHeX 事件数据库中的键 (pokeldn.pokemon.Service.gift_events)"
"the Net protocol id to send the connection request under" = "用于发送连接请求的 Net 协议 id"
"the OnlineState we report when asked; 4 raises the trade bubble" = "被询问时所报告的 OnlineState；4 会升起交换气泡"
"the OpcState.OnlineState our character reports when the console asks for NetCharacterStateData. 0 NONE means \"doing nothing\" and is a character doing nothing; 3 RECRUITMENT_BATTLE, 4 RECRUITMENT_TRADE, 5 RECRUITMENT_RECORD, 6 RECRUITMENT_GREETINGS, 8 COMMUNICATE" = "当游戏机请求 NetCharacterStateData 时，我方角色上报的 OpcState.OnlineState。0 NONE 意为「doing nothing」，表示角色什么都不做；3 RECRUITMENT_BATTLE、4 RECRUITMENT_TRADE、5 RECRUITMENT_RECORD、6 RECRUITMENT_GREETINGS、8 COMMUNICATE"
"the Pia message flags on our bulk acks; 0xa0 is what both retail stations send, and bit 5 compresses the message body" = "我方批量 ack 上的 Pia 消息标志；0xa0 是两个零售站点都会发送的值，其中第 5 位表示压缩消息主体"
"the Pia message port. The console sends its 0x80 acks on 0 AND 1, each packet carrying both; \"0,1\" mirrors that" = "Pia 消息端口。游戏机在 0 和 1 两个端口上发送它的 0x80 ack，每个数据包同时携带两者；\"0,1\" 即照此镜像"
"the Pia port the join travels on; the update mesh uses the reliable one" = "加入所走的 Pia 端口；更新 mesh 使用可靠端口"
"the PlayerInfo language byte, a MsgLangId (3 is French); 1, 8, 9 and 10 cap the greeting's name at 6 characters, others at 12 (docs/bdsp_protocol.md)" = "PlayerInfo 的语言字节，即 MsgLangId（3 为法语）；1、8、9、10 会把问候语中的名字限制为 6 个字符，其它为 12 个 (docs/bdsp_protocol.md)"
"the Pokemon we trade: a complete, legal, encrypted 328-byte PB8 whose PID the console's save does not already hold; repeatable, one per trade in order, the last offered again after the list" = "我们要交换的宝可梦：一只完整、合法、加密的 328 字节 PB8，其 PID 尚未被游戏机的存档持有；可重复，每场交换一只按顺序，列表用完后再次提供最后一只"
"the RTT protocol version byte" = "RTT 协议版本字节"
"the Wonder Card flag id our trainer card claims in the Union Room card exchange. A console holding the card with that id arms its own card counters, so a trade or cable-club battle with us increments them [union_room.c:1777]; default 0, which arms nothing" = "我方训练家卡在联盟房间卡片交换中所声明的神秘卡片标志 id。持有该 id 卡片的游戏机会启用其自身的卡片计数器，因此与我方进行交换或电缆俱乐部对战会使其递增 [union_room.c:1777]；默认 0，不启用任何计数器"
"the ability id of the built record; --offer-species leaves the template's ability where it was" = "所构建记录的特性 id；--offer-species 会让模板的特性保持原样"
"the adventure seed (ChikaBattleSeed): the rentals and encounters; random by default" = "冒险种子（ChikaBattleSeed）：决定租借宝可梦与遭遇；默认随机"
"the advertised scene id, in place of the one --code gives" = "所广播的 scene id，取代 --code 给出的那个"
"the byte to answer it with (default 0, what a console answers a {1} with [0x1c27f48]; a {1} reads as our back-out and, past phase 2, shows 'the partner canceled the trade')" = "用于回应它的字节（默认 0，即游戏机回应 {1} 所用的值 [0x1c27f48]；一个 {1} 会被读作我方退出，并且在阶段 2 之后显示「the partner canceled the trade」）"
"the console's protocol count, if already measured; skips the sweep" = "游戏机的协议数量，若已测得；会跳过扫描"
"the delivery group of the event's den, 1 to 10; by default the first with dens and an encounter at that progress" = "该活动巢穴的投递组，1 到 10；默认取第一个既有巢穴、又在该进度下有遭遇的组"
"the eight digits the player types" = "玩家输入的八位数字"
"the eight digits; '' joins any code" = "那八位数字；'' 表示加入任意连接码"
"the experience in the offered record; the level the game shows is the curve's, so this and --trade-box-level go together" = "所提议记录中的经验值；游戏显示的等级由经验曲线决定，因此这一项与 --trade-box-level 需配合使用"
"the experience word at 0x10 of the built record" = "所构建记录在 0x10 处的经验值字段"
"the handshake form of --confirm-command: send the NEXT of these on each new four-byte body the confirmation content puts on elementId 20000. Content 40's own machine sends 0,1,2,3 and parks after each; one command buys two rungs and then the ladder stops" = "--confirm-command 的握手形式：确认 content 每在 elementId 20000 上放出一个新的四字节主体，就发送这些值中的下一个。content 40 自身的机器会依次发送 0,1,2,3 并在每一步后停住；一条命令能换到两级，之后阶梯就停住"
"the header's destination list. \"console\" names its station constant id, which is what its own broadcast acks do to us; \"none\" sends count 0, which 0x01859578 never filters and every 0x7C message carries. \"auto\" mirrors the console per protocol: none on 0x7C, the console on 0x80" = "头部的目标列表。「console」指明其 station 常量 id，也就是它自己的广播 ack 对我们所做的；「none」发送 count 0，0x01859578 从不过滤它，且每条 0x7C 消息都会携带。「auto」按协议镜像游戏机：0x7C 上为 none，0x80 上为游戏机"
"the header's own 'lowest sequence pending ack'. We have sent nothing on this protocol, so 1 (the next id we would use) and 0 are both readings; the console itself sends 1 while waiting on its own first message" = "头部自己的「最低待确认序列」。我们在这个协议上没有发送过任何内容，因此 1（我们接下来会用的 id）和 0 两种解读都成立；游戏机自己在等待其第一条消息时发送的是 1"
"the host's advertise data as hex, or @FILE, instead of scanning for it. Needs --host-mac alongside" = "以十六进制或 @FILE 给出主机的通告数据，而不是靠扫描获得。需同时提供 --host-mac"
"the host's player name in the station-list update, which the game reads as identity; a real name in place of the placeholder single space" = "站点列表更新中主机的玩家名，游戏会将之读取为身份；用一个真实名字代替占位用的单个空格"
"the hosting station's MAC, as it appears in its own advertisement" = "主持方 station 的 MAC，如同它自己的宣告中所显示的那样"
"the level byte at 0x148 of the built record, 1..100; the experience word is left alone unless --offer-experience is given" = "所构建记录在 0x148 处的等级字节，1..100；除非给出 --offer-experience，否则经验值字段保持不变"
"the level byte in the offered record's party tail" = "所提供记录队伍尾部中的等级字节"
"the link code the player enters: three picker names (English or French) or indices 0-9, comma-separated" = "玩家输入的连接码：三个选择器名称（英文或法文）或 0-9 的索引，以逗号分隔"
"the link code the player types" = "玩家输入的连接码"
"the local communication version our NodeInfo publishes on the LAN path; a host publishes its own application version there" = "我方 NodeInfo 在 LAN 路径上发布的本地通信版本；主机会在那里发布自己的应用版本"
"the message flags on the Net 0x11 opening; a retail host sends 0x31, this host's own default is 0x01" = "Net 0x11 开启时的消息标志；零售主机发送 0x31，本主机自己的默认值是 0x01"
"the message flags on the Net 0x50; a pair's host sends 0x31 on it and on its 0x11, and this host's 0x11 needs 0x01 to be answered at all" = "Net 0x50 上的消息标志；一对中的主机在它和它的 0x11 上都发送 0x31，而本主机的 0x11 需要 0x01 才会被应答"
"the message flags on the Session replies; a Scarlet host sends 0x00, this host's own default is 0x01" = "Session 各条回复上的消息标志；Scarlet 主机发送 0x00，而本主机的默认值是 0x01"
"the move slot our Pokemon uses every turn" = "我方宝可梦每回合使用的招式栏位"
"the name in OUR trainer record" = "我方训练家记录中的名称"
"the name in our data exchange record; the console shows it" = "我方数据交换记录中的名字；游戏机会显示它"
"the name the Session join's PlayerInfo carries; a reference joiner sends one space" = "Session 加入请求的 PlayerInfo 所携带的名字；参考加入方发送一个空格"
"the name the raid lobby shows for us" = "团体战大厅为我们显示的名称"
"the network's own name" = "网络自身的名称"
"the nickname in the offered record" = "所提供的记录中的昵称"
"the nickname of the built record; sets the nicknamed flag" = "构造出的记录的昵称；会设置已起昵称标志"
"the nickname our connection response carries" = "我方连接响应携带的昵称"
"the nickname the connection response carries, what the console shows as the partner (a real station sends its Switch profile's)" = "连接响应携带的昵称，即游戏机显示为伙伴的名字（真实站点会发送其 Switch 个人资料中的昵称）"
"the offer place we take; by default the first the host left" = "我方占用的提议位置；默认是主机留下的第一个"
"the original trainer name of the built record" = "所构建记录的初训家名称"
"the packet header's destination variable id on the join request: 0, which is what a joining Arceus uses, or the host's own" = "加入请求中数据包头部的目标变量 ID：0，即发起加入的 Arceus 所用之值，或主机自己的那个"
"the packet id in the Pia header of the Session replies; a Scarlet host's join response carries 1" = "Session 各条回复 Pia 头部中的数据包 ID；Scarlet 主机的加入响应携带 1"
"the party record our player brings to the raid, legal per PKHeX; with --raid-seed" = "我方玩家带入团体战的队伍记录，按 PKHeX 判定为合法；配合 --raid-seed 使用"
"the party slot we offer" = "我方提议的队伍栏位"
"the phy renumbers on every driver reload" = "每次重新加载驱动，phy 都会重新编号"
"the player name in that record; the game shows it as the trade partner (default --player-name)" = "该记录中的玩家名；游戏会把它显示为交换伙伴（默认取 --player-name）"
"the player name in the join request's one player record; a retail console's is a single space" = "加入请求中那条玩家记录里的玩家名称；零售游戏机使用的是单个空格"
"the player name our identity carries, the one the trade screen shows" = "我方身份携带的玩家名，也就是交换界面显示的那个"
"the player name our side carries" = "我方一侧携带的玩家名"
"the player name record 1 of our identity carries, the one the trade screen shows" = "我方身份中记录 1 所携带的玩家名称，也就是交换界面显示的那个"
"the protocol the host sends its reliable game data on; the game's own reader polls 0x80 (BroadcastReliable), so 0x80 puts data where the game drains it" = "主机发送其可靠游戏数据所用的协议；游戏自己的读取器轮询 0x80（BroadcastReliable），所以 0x80 会把数据放到游戏取用的位置"
"the record to trade away, stored or party, encrypted or not; the default is the reference Azelf under our player name. Repeatable: one per trade in order, on this seat or in the host role once taken" = "要交换出去的记录，队伍中或电脑盒中的皆可，加密与否皆可；默认是我们训练家名下的参考 Azelf。可重复：每场交换一条，按顺序，在本栏位上或取得主机角色后使用"
"the reliable header's destination bits; 3 adds the four-byte bitmap a retail station sends, 0 leaves the nine-byte header" = "可靠头部的目标位；3 会加上零售版站点发送的四字节位图，0 则保持九字节头部"
"the retransmit interval. A window retransmits until it is acked" = "重传间隔。窗口会一直重传直到被确认"
"the room both players enter; default the link code, and no code meets anyone else trading online without one" = "两位玩家进入的房间；默认为连接码；没有连接码，就遇不到任何其它在线交换的玩家"
"the same on z" = "z 上同理"
"the sequence id in the station-list update; a Scarlet host sends 1 where its join response sent 0" = "站点列表更新中的序列 ID；Scarlet 主机在此发送 1，而其加入响应中发送的是 0"
"the sequence id the join response promises; a type-5 update must reach it" = "加入响应所承诺的序列 ID；类型 5 的更新必须达到它"
"the sequence id. 1 is what both windows ask for; the first message also carries FLAG_IS_INITIALIZED and DEFINES where the stream starts" = "序列 id。1 正是两个窗口都请求的值；第一条消息还携带 FLAG_IS_INITIALIZED，并确定流从何处开始"
"the station BITMAP on 0x58 and 0x7C. The console sends 2 to us, station index 1; 1 is the bit for station 0, which is the console" = "0x58 和 0x7C 上的 station BITMAP。游戏机向我们（station 索引 1）发送 2；1 是 station 0 的位，也就是游戏机自己"
"the station platform byte we publish; 1 is what a Switch 2 sends" = "我们发布的站点平台字节；1 是 Switch 2 所发送的值"
"the station platform byte: 1 is a Switch 2, which is what both retail consoles advertise; 0 is a Switch and what the LDN layer defaults to" = "station 平台字节：1 是 Switch 2，两台零售游戏机宣告的都是它；0 是 Switch，也是 LDN 层默认使用的值"
"the station platform byte; both retail consoles here are Switch 2" = "站点平台字节；此处两台零售游戏机都是 Switch 2"
"the story stage, which sets a standard crystal's star odds" = "剧情阶段，它决定普通结晶的星级概率"
"the stream id. 0 is what the console sends on both protocols" = "流 ID。0 是游戏机在两个协议上发送的值"
"the tested flag set: 'capture' records the console's party snapshot, 'trade' needs --send-snapshot" = "经过测试的标志集合：'capture' 记录游戏机的队伍快照，'trade' 需要 --send-snapshot"
"the trainer id pair written over the identity's" = "覆盖身份中原有值的那对训练家 id"
"the unlock stage the partners come from, which sets their pool, their level being four fifths of --raid-pokemon's; by default --raid-progress's, six stars for a black crystal or a seven-star event raid" = "伙伴来自的解锁阶段，它决定伙伴池；其等级为 --raid-pokemon 所给等级的五分之四；默认取 --raid-progress 的阶段，黑色结晶或七星活动团体战则为六星"
"the variable id we send as our own until the console names one" = "在游戏机指定一个之前，作为我方自己的变量 id 发送的那个值"
"the whole run" = "整个运行过程"
"theirs" = "对方"
