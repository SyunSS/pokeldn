"hex packet flags ORed into the Session join's header: 4 is the band's skip-network-connection-check bit, which a station the console has not yet connected may owe" = "以十六进制表示、按位或进 Session 加入请求头部的数据包标志：4 是该频段的「跳过网络连接检查」位，尚未与游戏机建立连接的一方可能欠着它"
"hex, 16 bytes: the host's player id in the station-list update, a real principal id in place of the placeholder" = "十六进制，16 字节：站点列表更新中主机的玩家 ID，用一个真实主体 ID 代替占位值"
"hex, 16 bytes; default lets the LDN layer pick" = "十六进制，16 字节；默认由 LDN 层选择"
"hex, four bytes: the player id in our data exchange record" = "十六进制，四字节：我方数据交换记录中的玩家 id"
"hex, sixteen bytes: the player id in the session join request" = "十六进制，十六字节：会话加入请求中的玩家 id"
"hex, the 40 game bytes of the advertisement; a searching console leaves them zero, a host that a joiner reached carried 648cf4 at +0x21" = "十六进制，通告中的 40 个游戏字节；正在搜索的游戏机把它们留为全零，而被加入方连上的主机在 +0x21 处携带 648cf4"
"hex: once the console speaks on reliable, send this as the host's own reliable seq-1 data (the game leaves at +10 s if the host never speaks)" = "十六进制：一旦游戏机在可靠通道上开口，就把它作为主机自身的可靠 seq-1 数据发送（若主机始终不开口，游戏会在 +10 秒时离开）"
"hex: the four-byte player id in that record" = "十六进制：该记录中的四字节玩家 id"
"hex: the personality value in the offered record. HYPOTHESIS: a record is shiny when the trainer id, the secret id and the two halves of this value exclusive-or to under 16, which is the Gen-6 rule and is untested here" = "十六进制：所提议记录中的性格值。假设：当训练家 id、里 id 与该值的两半异或结果小于 16 时，该记录为异色，这是第六世代的规则，此处尚未验证"
"hex; defaults to Sword's 0x0100abf008968000" = "十六进制；默认为剑版的 0x0100abf008968000"
"hex; the Session join's 32-byte identification token, zero-padded. A reference joiner sends 0x06 and zeroes" = "十六进制；会话加入的 32 字节标识令牌，以零填充。参考加入方发送 0x06 加全零"
"hex; the application communication version the Session join declares. Six is what a reference joiner sends and what the advertisement carries" = "十六进制；会话加入所声明的应用通信版本。6 是参考加入方发送、也是通告中携带的值"
"hex; the default is Legends Z-A's" = "十六进制；默认使用传说 Z-A 的"
"hex; the default is the title's. An emulated Z-A advertises and scans for ffffffffffffffff over ldn_mitm" = "十六进制；默认值为该作品自身的值。模拟的 Z-A 在 ldn_mitm 上会通告并搜索 ffffffffffffffff"
"hidden-power" = "hidden-power"
"hidden-power-type" = "hidden-power-type"
"hm-moves" = "hm-moves"
"hold the Session join request this long after the host's first Net 0x11. A join the console accepts after its WaitMember draws the type 7 that hands us the host role (docs/pla.md, Joining a console's network)" = "在主机第一个 Net 0x11 之后把 Session 加入请求挂起这么久。游戏机在其 WaitMember 之后接受的加入会引出类型 7，从而把主机角色交给我们 (docs/pla.md, Joining a console's network)"
"hold the Session join request this long after the seat. A console whose WaitMember (3 to 4 s) ends unjoined leaves with host migration, so a join accepted in its leave wait draws the type 7 (docs/sv.md, What decides a seat)" = "在安排栏位之后，把 Session 加入请求挂起这么久。若某台游戏机的 WaitMember（3 到 4 秒）在未加入的状态下结束，它会带着主机迁移离开，因此在其离开等待期内才被接受的加入会招来 type 7（docs/sv.md, What decides a seat）"
"hold the seat after the console's NetStartHostMigration (Net 0x40). By default the joiner leaves on the first one: the console is destroying its network and resends it until every client has left, for up to 4 s" = "在游戏机发出 NetStartHostMigration（Net 0x40）之后继续占住座位。默认情况下加入方在收到第一个时就离开：游戏机正在销毁自己的网络，并会一直重发直到所有客户端离开，最长 4 秒"
"host" = "主机"
"host a Dynamax Adventure (Max Lair) lobby whose legendary is this species; the host leaves once the adventure starts (docs/swsh_raid.md)" = "主持一个极巨团体战（极巨巢穴）大厅，其传说的宝可梦为该物种；探险开始后主机即离开（docs/swsh_raid.md）"
"host a Max Raid den lobby with this boss instead of a Link Trade (docs/swsh_raid.md)" = "以此 Boss 主持一个极巨团体战巢穴大厅，而不是进行连接交换 (docs/swsh_raid.md)"
"host a Max Raid with a boss of this Wild Area Event delivery (an EventsGallery 'Index NNN' folder) instead of --raid-boss; its rewards unless --raid-reward (docs/swsh_raid.md, Event raids)" = "用这个旷野地带活动派发（EventsGallery 中名为 'Index NNN' 的文件夹）的 Boss 主持极巨团体战，而不是用 --raid-boss；奖励也取自该活动，除非给了 --raid-reward（docs/swsh_raid.md，Event raids）"
"host a Tera Raid: the raid seed, eight hex digits; the boss, its Tera type and the rewards follow from it and the four --raid-* context flags" = "主持太晶团体战：团体战种子，八位十六进制数字；头目、其太晶属性与奖励由该种子以及四个 --raid-* 上下文开关决定"
"host an emulated console over ldn_mitm, with no radio" = "通过 ldn_mitm 主持一台模拟游戏机，不使用无线电"
"host an event raid: a Poke Portal News delivery's folder (an EventsGallery event, or its Files); the seed draws from the event's encounters at --raid-version and --raid-progress, and --raid-map and --raid-content are unused" = "主持活动团体战：宝可入口站新闻投递的文件夹（EventsGallery 中的一个活动，或其 Files）；种子依据 --raid-version 与 --raid-progress 从该活动的遭遇中抽取，--raid-map 与 --raid-content 不使用"
"host for a real Switch" = "为真实 Switch 主持"
"host for an emulated console over the LAN instead of over the radio: answer ldn_mitm discovery on port 11452 and carry Pia over UDP. Takes the address to advertise, or auto. Needs no adapter, no prod.keys and no root" = "通过 LAN 而非无线电为模拟的游戏机主持：在端口 11452 上回应 ldn_mitm 发现，并用 UDP 承载 Pia。接受要宣告的地址，或 auto。不需要适配器、不需要 prod.keys，也不需要 root"
"host for the Union Room (the middle NPC on Pokemon Center 2F) instead of the trade centre's third NPC; use with --union-room-keepalive 120 and --board-type" = "改为主持联盟房间（宝可梦中心 2 层中间那位 NPC），而不是交换中心的第三位 NPC；请配合 --union-room-keepalive 120 与 --board-type 使用"
"host over ldn_mitm for an emulator instead of the radio (docs/ldn.md)" = "在模拟器上通过 ldn_mitm 主持，而不是使用无线电 (docs/ldn.md)"
"host over ldn_mitm on the LAN for an emulator; no radio and no root" = "为模拟器在局域网上通过 ldn_mitm 主持；不使用无线电也不需要 root"
"host the cable-club COLOSSEUM instead of the trade centre (Pokemon Center 2F, third NPC -> Colosseum -> Single Battle -> JOIN). The entry is the trade centre's, so --card-flag-id still arms the console's card counters, and only this path increments its battlesWon [decomp:src/cable_club.c:792]. The whole party fights" = "主持电缆俱乐部 COLOSSEUM，而不是交换中心（宝可梦中心 2 层，第三位 NPC → Colosseum → Single Battle → JOIN）。入口用的是交换中心的，因此 --card-flag-id 仍会为游戏机的卡片计数器置位，并且只有这条路径会递增其 battlesWon [decomp:src/cable_club.c:792]。整支队伍都会参战"
"host the room the player enters with this password, e.g. 00000000" = "主持玩家用此密码进入的房间，例如 00000000"
"how far to advance a trade RPC's clock in our answer. 5 is nxldn-lab's and is the one number in this path nothing here has measured" = "在我方应答中把交换 RPC 的时钟推进多远。5 是 nxldn-lab 的取值，也是这条路径上此处唯一没有实测过的数字"
"how long one connection request waits for its answer" = "一个连接请求等待其应答的时间"
"how long one seat is held" = "一个座位保持多久"
"how long silence has to last to count as an ack that landed" = "静默需持续多久才算一个已送达的 ack"
"how long to hold one seat" = "一个座位保持多久"
"how long to hold the network up" = "保持网络运行的时间"
"how long to host" = "主持多久"
"how long to keep acking the mesh join response; the host repeats it every 500 ms until it is acknowledged" = "要持续确认网格加入响应多久；主机每 500 毫秒重复一次，直到被确认"
"how long to keep retransmitting if nothing acknowledges it; 0 sends until the run ends" = "若无人确认，继续重传多久；0 表示一直发送到运行结束"
"how long to keep trying" = "持续尝试多久"
"how long to retransmit the connection request and listen for its reply" = "重传连接请求并监听其回应的时间"
"how long to retransmit the join request; Pia's own joiner gives up at 10" = "重传加入请求多久；Pia 自己的加入方在第 10 次时放弃"
"how long to stay in one joined session before scanning again" = "在一个已加入的会话中停留多久后再次扫描"
"how long to wait for the scan response and the sync" = "等待扫描响应与同步的时长"
"how long to wait for the station acceptance before giving up on joining" = "等待 station 接受多久之后放弃加入"
"how long to wait for the station handshake before giving up on sending" = "发出之前等待 station 握手多久之后放弃发送"
"how many 21-byte station slots the Net 0x11 carries; a retail host writes four whatever the game's participant limit is" = "Net 0x11 携带多少个 21 字节的站点栏位；无论游戏的参与者上限是多少，零售主机都会写入四个"
"how many RFU slots a second the host emits (default 59.727, one per GBA VBlank). A real console pair runs far below this; lowering it slows every link step by the same factor." = "主机每秒发出多少个 RFU 时隙（默认 59.727，即每个 GBA VBlank 一个）。真实的游戏机对远低于此值；调低它会让每个连接步骤按相同比例变慢。"
"how many kind 1 identities to send, 0.3 s apart under successive steps" = "要发送多少条 kind 1 身份，在相继的步骤下间隔 0.3 秒"
"how many party clones (ids 2 up) to announce after the identities; the reference host announced two" = "在身份之后要通告多少个队伍克隆（从 id 2 起）；参考主机通告了两个"
"how many selection records to send; a reference joiner sent sixteen" = "发送多少条选择记录；参考加入方发送了十六条"
"how many sequence ids of ours to send in all; 0 has no limit. One message does not hold the console's state; it sends its own heartbeat about 580 times in 180 s" = "总共要发送多少个我方序列号；0 表示没有限制。一条消息并不能维持游戏机的状态；它在 180 秒内会发送约 580 次自己的心跳"
