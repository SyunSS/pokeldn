"leave the way a console backs out when both players have voted and the host has not agreed for this long, before any commit; 0 never. It ends the wait, not the trade lock a confirmed trade already saved" = "按游戏机在双方都已投票、而主机这么久仍未同意时的退出方式离开（在任何提交之前）；0 表示永不。它结束的是等待，而不是已确认交换已经保存的交换锁"
"leave this long after the last queued trade's fourth step; by default the seat is kept until the player backs out or --hold ends, as every joiner does" = "在最后一次排队交换的第四步之后等待这么久再离开；默认会一直保留座位，直到玩家退出或 --hold 结束，如同每个加入方那样"
"leave this long after the last queued trade; by default the seat is kept until the console's player backs out or --hold ends" = "在最后一次排队的交换之后等待这么久再离开；默认会一直保留席位，直到游戏机的玩家退出或 --hold 结束"
