"number of sequential trades to perform, 1..6 (default 1; 6 = swap both entire parties). After the Nth trade the sim cancels-to-leave." = "要执行的连续交换次数，1..6（默认 1；6 = 交换双方整支队伍）。第 N 次交换之后，模拟器会取消并离开。"
"offer" = "提议"
"offer a record of the host's own rather than the captured one: the same Pokemon under the data exchange's player name and id and a new identity, so the console is not offered the record it is itself holding" = "提供主机自己的记录而不是抓取到的记录：同一只宝可梦，使用数据交换中的玩家名称和 id，但换一个新身份，这样就不会把游戏机自己持有的记录再提供给游戏机"
"offer back the exact PK8 the console just offered us, unchanged, instead of one out of --send-snapshot. These bytes came out of its own save, so a run that still aborts rules the record out" = "原样回传游戏机刚刚提供给我们的那个 PK8，而不是从 --send-snapshot 里取一个。这些字节出自它自己的存档，因此若运行仍然中止，就可以把该记录排除"
"offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "以新的 PID 和加密常数提供每一条记录，保持异色状态，这样之前接收过它的存档还能再次接收"
"offer every --offer and --next-offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "用新的 PID 和加密常数提供 --offer 与 --next-offer 中的每个结构，保留异色状态，使之前接受过它的存档能再次接受"
"offer every --offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "用新的 PID 和加密常数提供 --offer 中的每个结构，保留异色状态，使之前接受过它的存档能再次接受"
"offer it under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "用新的 PID 和加密常数提供它，保留异色状态，使之前接受过它的存档能再次接受"
"offer the host's own Pokemon on the game channel: answer the console's trade box with one of ours at sequence 2 on port 0" = "在游戏频道上提供主机自己的宝可梦：在端口 0 上以序列 2 用我们的一只宝可梦回应游戏机的交换电脑盒"
"offer the record under a new PID and encryption constant, drawn once per run, shiny state kept, so a save that took it before takes it again" = "以新的 PID 和加密常数提供该记录（每次运行抽取一次），保持异色状态，这样之前接收过它的存档还能再次接收"
"offer this record file instead of the reference one; stored or party, encrypted or decrypted. Repeatable, one per trade in order; the last is offered again after the list" = "提供这个记录文件而不是参考文件；队伍中或电脑盒中的皆可，加密或解密均可。可重复，每场交换一只按顺序；列表用完后再次提供最后一只"
"offline: replay a capture's host stream" = "离线：重放某次抓包中的主机流"
"once a hash body has been answered, `ping` content N's 10000-base holder on port 0 to open the next phase - 40 is the confirmation, so this sends `382700000a00`. The console stops sending 40050 once the hash answer lands and says nothing further; Pia retransmits anything it still waits on, so that silence means satisfied and the next phase needs opening" = "某个哈希主体被回应之后，在端口 0 上向其内容 N 的 10000-base 持有者发送 `ping`，以开启下一阶段——40 即确认，因此这里发送 `382700000a00`。哈希答复到达后游戏机便不再发送 40050，也不再有任何后续；Pia 会重传它仍在等待的内容，因此这种沉默表示已满足，下一阶段需要由我方开启"
"once a hash body has been answered, open content N's phase by sending the two-member RPC pair for it (40 is the confirmation). A pair is the only shape that opens a phase on this console: 40030 opened the offer and 40050 the selection. A bare content ping (`382700000a00`) and a bare sync-120 ping (`780000000a00`) are both ignored" = "某个 hash 正文被回应之后，通过发送该内容的两成员 RPC 对来开启内容 N 的阶段（40 是确认）。在这台游戏机上，只有成对形式才能开启一个阶段：40030 开启了提议阶段，40050 开启了选择阶段。单独的内容 ping（`382700000a00`）与单独的 sync-120 ping（`780000000a00`）都会被忽略"
"once a hash body has been answered, send `ping` on sync holder N (120 is the confirmation's) on port 0. The console drives 97, 60000, 110 and 130 itself and opens the selection phase when 130's pingSynced lands; it never sends 120. A phase follows its sync, not a content ping" = "某个 hash body 得到回应后，在端口 0 上向同步持有者 N 发送 `ping`（120 是确认的那个）。游戏机自己驱动 97、60000、110 和 130，并在 130 的 pingSynced 到达时开启选择阶段；它从不发送 120。阶段跟随的是它的 sync，而不是内容 ping"
"once in the mesh, do not answer the host's RTT requests and send none of our own. Default: answer them and send one a second" = "进入 mesh 后不回应主机的 RTT 请求，也不发自己的。默认：回应它们并每秒发一个"
"once in the mesh, do not run the Sync Clock Protocol (0x1c): a request every 2 s, the host's reply carrying the mesh clock in ms. Default: run it" = "进入 mesh 后不运行 Sync Clock Protocol (0x1c)：该协议每 2 秒发一次请求，主机的回应携带以毫秒计的 mesh 时钟。默认：运行"
"once in the mesh, do not run the clone clock exchange (requests every 0.2 s, replies with our ms clock, participate after ten answers: docs/lgpe_session.md). Default: run it" = "进入网格后，不执行克隆时钟交换（每 0.2 秒请求一次，用我方毫秒时钟回复，回答十次后参与：docs/lgpe_session.md）。默认：执行"
"once joined, echo RTT and acknowledge the reliable stream so the console does not time out after 12 s and leave" = "加入之后，回显 RTT 并确认可靠流，以免游戏机在 12 秒后超时离开"
"once the confirmation ladder has produced its first step, end the run as soon as SECONDS pass with no NEW step body: stop transmitting, drop the link and let the console report a lost connection. Holding a stalled ladder open with acks instead makes the game declare the TRADE failed, which costs the player about an hour. Nothing but acks follows the last step body. 0 is off and the hold runs in full." = "一旦确认阶梯产生第一个步骤，则在 SECONDS 秒内没有新步骤正文时立即结束运行：停止发送、断开链路，让游戏机报告连接丢失。若改用 ack 让停滞的阶梯一直保持打开，游戏会宣告交换失败，这会浪费玩家约一小时。最后一个步骤正文之后只有 ack。0 表示关闭，此时保持流程会完整进行。"
"once the mesh is running, send one Atomic (0x74) kind-0 announce; a probe for whether a host announce fills an element slot (report 163)" = "mesh 运行起来后，发送一个 Atomic (0x74) kind-0 通告；用于探测主机通告是否会占用一个元素槽位（报告 163）"
"once the migration makes us the host, broadcast UPDATE_MESH the way the console did: its own last one with the host index set to ours. The console stops sending these once it hands the role over, and the mesh is gone about 1.3 s later if nothing takes over" = "迁移使我们成为主机后，像游戏机那样广播 UPDATE_MESH：用它自己的最后一条，并把主机索引改为我们的。游戏机一旦移交该角色就不再发送这些消息；若无其他方接手，网格约 1.3 秒后就会消失"
"once the session is up, open the game's reliable streams and send the identity, the selection record and, with --trade-offer, an offer" = "会话建立后，打开游戏的可靠流，并发送身份、选择记录，以及在指定 --trade-offer 时发送一个提议"
"only join a console waiting on this link code" = "只加入等待此连接码的游戏机"
"only the broadcast pass, the framing the ack proved" = "只做广播这一轮，即 ack 已验证过的组帧方式"
"only the unicast pass, skipping the broadcast one" = "只进行单播那一轮，跳过广播那一轮"
"open the game's own reliable channel (0x7c) once the data exchange is done: answer the console's channel message, send the same back, and open the host's own port-0 channel, which is what the trade flow's step 0x20 ticks its network object for" = "数据交换完成后打开游戏自身的可靠信道（0x7c）：回应游戏机的信道消息、回发同样的内容，并打开主机自己的端口 0 信道——交换流程的步骤 0x20 正是为它驱动网络对象"
"optional Sword advertisement (hex, raw, or swsh_net_facts.json); without one, build a fresh station record" = "可选的剑版广播数据（十六进制、原始数据，或 swsh_net_facts.json）；不提供则构建一条新的站点记录"
"optional machine-local TOML (default: sibling host.local.toml)" = "可选的机器本地 TOML（默认：同目录下的 host.local.toml）"
"optional saved Sword 0x84 snapshot; otherwise use the joining console's snapshot from this session" = "可选的已保存剑版 0x84 快照；否则使用加入方游戏机在本次会话中的快照"
"optional seconds to keep the seat once the console is back on its box after a trade, then hand the console the session and close; by default the host waits for the console to leave" = "交换完成后游戏机回到电脑盒后，保留栏位的可选秒数，然后将会话交给游戏机并关闭；默认情况下主机会等游戏机离开"
"our Pia variable id; random by default" = "我们的 Pia 变量 ID；默认随机"
"our kind-1 identity message, sent when the console's arrives: a captured 376-byte message, header included, or echo for the console's own back" = "我们的 kind-1 身份消息，在游戏机的同类消息到达时发送：一条抓取到的 376 字节消息（含头部），或 echo 表示回显游戏机自己的那条"
"our own address on that LAN" = "我们在该局域网上的地址"
"our own constant id in the Session join: the LDN permutation of our MAC, which is the form the console publishes for itself, or the MAC as it is" = "我们在 Session 加入中自己的常量 ID：我们 MAC 的 LDN 置换，即游戏机为自己发布的那个形式，或 MAC 原样"
"our own station variable id; fresh random when omitted, because a reused one is 'already one of my stations' on BDSP" = "我们自己的站点变量 ID；省略时随机新生成，因为在 BDSP 上重复使用会被判为「already one of my stations」"
"our own variable id, any nonzero value" = "我们自己的变量 id，任何非零值"
"our own variable id, any nonzero value (the console's is random)" = "我们自己的变量 id，任何非零值（游戏机的值是随机的）"
"our player readies this long after the guest's lobby opens" = "访客的大厅开启后我方玩家等待这么久才准备"
"our trade trainer record" = "我方的交换训练家记录"
"ours" = "我方"
"override the level shown on the trading board" = "覆盖交换板上显示的等级"
