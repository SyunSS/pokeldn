"(live) override the RFU connection id (hex, e.g. 7036) sent in the emulator connect ('C') frame. Default: a random nonzero id - any nonzero value works. --parent-pid is a deprecated alias." = "（实时）覆盖模拟器 connect（'C'）帧中发送的 RFU 连接 ID（十六进制，例如 7036）。默认：一个随机的非零 ID——任何非零值都可行。--parent-pid 是已弃用的别名。"
"(live) record every Pia datagram both directions to a .jsonl (incl. the SSID), so a live attempt can be decrypted/analysed offline" = "（实机）把双向的每个 Pia 数据报记录到 .jsonl 文件（含 SSID），以便对实机尝试进行离线解密/分析"
"--ip-join: hold one scan socket and connect the instant a fresh network appears, to land before the host latches its node list" = "--ip-join：持有一个扫描套接字并在新网络出现的瞬间连接，以赶在主机固定其节点列表之前接入"
"--ip-join: our address" = "--ip-join：我方地址"
"--ip-join: our own address" = "--ip-join：我们自己的地址"
"--ip-join: our own address on that LAN" = "--ip-join：我方在该 LAN 上的地址"
"--ip-join: seconds to wait for one ldn_mitm scan answer" = "--ip-join：等待一次 ldn_mitm 扫描回应的秒数"
"--ip-join: the address a scan leaves from; default --our-ip" = "--ip-join：扫描所用的源地址；默认取 --our-ip"
"--ip-join: the console's address" = "--ip-join：游戏机的地址"
"--ip-join: the emulator's address" = "--ip-join：模拟器的地址"
"--room-pattern fixed: seconds a join has to draw the console's request for NetCharacterStateData before the next goes out" = "--room-pattern fixed：一次加入必须引出游戏机对 NetCharacterStateData 的请求所需的秒数，超时后才发下一个"
"0 is accepted" = "0 表示接受"
"0 makes the game roll one" = "0 表示让游戏自行生成一个"
"0 male, 1 female: the gender in our data exchange record; its look follows" = "0 为雄性，1 为雌性：我方数据交换记录中的性别；其外观随之而定"
"0 male, 1 female: the gender in that record, whose look follows it" = "0 为雄性，1 为雌性：该记录中的性别，其外观随之而定"
"0 to 24 (default random)" = "0 到 24（默认随机）"
"0 to 255 (default random)" = "0 到 255（默认随机）"
"0-based host party slot offered for one trade (default: 1)" = "为一次交换所提供的主机队伍栏位（从 0 起，默认：1）"
"0x80 (the broadcast reliable window, the default: it asks us for sequence 1 once a second) or 0x7c (the unicast one, which has never had an ack to send us because it has never had our data)" = "0x80（广播可靠窗口，默认：它每秒向我方请求序列 1）或 0x7c（单播的那个，它从未有 ack 发给我方，因为它从未收到过我方的数据）"
"1 against an expected 0 is a guaranteed 'version is too high'" = "用 1 对应预期的 0，必定触发「版本过高」"
"1 female (default 0)" = "1 为雌性（默认 0）"
"1, 6, 11; code (default): the channel the link code puts a searching console on, the only one it joins on; auto: scan for the console's own network under our scene id and host on its channel" = "1、6、11；code（默认）：连接码使搜索中的游戏机所处的信道，也是它唯一会加入的信道；auto：在我方 scene id 下扫描游戏机自身的网络，并在其信道上主持"
"232-byte box structure for the next trade in the same session; repeatable, one per trade after the first" = "同一会话中下一场交换所用的 232 字节盒子结构；可重复，第一场之后每场交换一个"
"3 is French" = "3 表示法文"
"3star" = "3star"
"4star" = "4star"
"5star" = "5star"
"6star" = "6star"
"ACK the console's 0x84 fragments (kind 0x21, a contiguous base and a bitmask). Nothing here has ever acked this protocol, which is why the console retransmits one snapshot 19142 times and never moves on" = "对游戏机的 0x84 分片（kind 0x21，一个连续基址与一个位掩码）发送 ACK。此前从未有任何实现确认过该协议，这正是游戏机将同一快照重传 19142 次且从不前进的原因"
"APPROACH the console's character instead of waiting to be approached. Picking an emote locks a player in place waiting to be interacted with, so a recruiting console can only be reached by someone walking up to it. Waits for its broadcast state to say it is advertising, then sends NetDataTalkReserveData - the console's own bytes, 63 00 01 00" = "主动靠近游戏机的角色，而不是等待被靠近。选择表情会把玩家固定在原地等待被互动，因此正在招募的游戏机只能由某个走上前去的角色接触。等待其广播状态表明它正在招募，然后发送 NetDataTalkReserveData——游戏机自己的字节，63 00 01 00"
"BPGD" = "BPGD"
"BPGE" = "BPGE"
"BPGF" = "BPGF"
"BPGI" = "BPGI"
"BPGJ" = "BPGJ"
"BPGS" = "BPGS"
"BPRD" = "BPRD"
"BPRE" = "BPRE"
"BPRF" = "BPRF"
"BPRI" = "BPRI"
"BPRJ" = "BPRJ"
"BPRS" = "BPRS"
"Crown Tundra" = "王冠雪原"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], a reliable data message sent that many seconds after the seat; the sequence follows the port's own. A pair's host sends its 0x7c port 1 table update at nine seconds this way" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在安排栏位之后经过这么多秒发送的一条可靠数据消息；其序列号沿用该端口自己的。成对交换中的主机就是以这种方式在第九秒发送它的 0x7c 端口 1 表更新"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the console announces its own key 0x80 open on 0x7c port 1. A port-0 message sent before that open is acknowledged by the console and never reaches the game, and so is everything after it on that port; repeatable; by default the identity fragments in pokeldn.sv.reference" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在游戏机宣布其自身密钥 0x80 于 0x7c 端口 1 打开之后经过这么多秒发送。在该打开之前发送的端口 0 消息会被游戏机确认，但永远不会到达游戏；该端口上其后的一切同样如此；可重复；默认使用 pokeldn.sv.reference 中的身份片段"
"DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the host announces key 0x80 open on 0x7c port 1. A station's identity is four messages on 0x7c port 0, the two fragments twice, and nothing sent on that port before the announcement reaches the game; repeatable; by default the identity fragments in pokeldn.sv.reference" = "DELAY:PROTO:PORT:HEX[:z][:start|:end]，在主机宣告 key 0x80 于 0x7c 端口 1 开启之后，经过这么多秒发送。一个 station 的身份是 0x7c 端口 0 上的四条消息，两个分片各两次，在宣告到达游戏之前该端口上不发送任何内容；可重复；默认使用 pokeldn.sv.reference 中的身份分片"
"Grand Underground: once the console's NetZoneData arrives, send a NetUgJoinData in its zone at its position plus --join-offset-x/z" = "大地下世界：一旦游戏机的 NetZoneData 到达，就在其区域、按其位置加上 --join-offset-x/z 发送一条 NetUgJoinData"
"Isle of Armor" = "铠之孤岛"
"LDN advertisement protocol version" = "LDN 广播协议版本"
"LDN local_communication_id (hex) to join (live); if omitted, joins the only available network (scan logs candidates)" = "要加入的 LDN local_communication_id（十六进制，实时）；若省略，则加入唯一可用的网络（扫描会记录候选）"
"LDN local_communication_id in hexadecimal" = "LDN local_communication_id，以十六进制表示"
"LDN passphrase as hex (live); default = the built-in 64-byte emulator passphrase (shared by frlg/rse)" = "以十六进制给出的 LDN 口令（实机）；默认 = 内置的 64 字节模拟器口令（frlg/rse 共用）"
"LDN passphrase hex; default uses the frlg emulator value" = "LDN 口令，十六进制；默认使用 frlg 模拟器的值"
"LDN scene; default is the known Direct Corner scene" = "LDN 场景；默认为已知的 Direct Corner 场景"
"LDN scene; default is the known FRLG scene" = "LDN 场景；默认使用已知的 FRLG 场景"
"NetDataTalkReserveResultData.IsCanTalk - 1 accepts the talk, 0 refuses it. A refusal is the SAFE probe: it should release the player rather than open a flow we cannot hold up" = "NetDataTalkReserveResultData.IsCanTalk——1 接受对话，0 拒绝它。拒绝是安全的探测：它应当释放玩家，而不是开启一个我们撑不住的流程"
"NetJoinData.avatarId, which is what picks the MODEL: it indexes UnionCharacterTable and OpLoadCharacter loads that asset name. 8 is what the default, the girl the screen shows" = "NetJoinData.avatarId，它决定使用哪个模型：它以索引访问 UnionCharacterTable，OpLoadCharacter 会加载对应的资源名。8 是默认值，也就是界面上显示的那个女孩"
"NetJoinData.colorId. The game also derives one from the avatar id (OpcManager.GetNpcColorId), so this may not be the deciding field" = "NetJoinData.colorId。游戏也会从 avatar id 推导出一个（OpcManager.GetNpcColorId），因此这可能并不是决定性字段"
"OT name for the offered Pokemon" = "所提供宝可梦的初训家名"
"PROTO:PORT:HEX, a reliable data message to send once the console has joined (host seq 1 on that port, INITIALIZED); repeatable" = "PROTO:PORT:HEX，一旦游戏机已加入就发送的一条可靠数据消息（在该端口上为主机 seq 1，INITIALIZED）；可重复"
"Pia port(s) for our 0x84 messages; the console sends on 0" = "我方 0x84 消息使用的 Pia 端口；游戏机在 0 上发送"
"Pia retransmits an unacknowledged join request every 500 ms" = "Pia 每 500 ms 重传一次未获确认的加入请求"
"StateData.isRecruiment, the second byte of the same answer" = "StateData.isRecruiment，同一个回应中的第二个字节"
"Switch prod.keys (live); default: keys_path from config/host*.toml" = "Switch 的 prod.keys（实时）；默认：取自 config/host*.toml 的 keys_path"
"THE CONTROL. Ack a sequence id the console never sent: a rebroadcast that carries on under --seq-delta 1 is what attributes a stop under 0 to the ack's CONTENT rather than to our merely having transmitted" = "对照组。确认一个游戏机从未发送过的序列 id：在 --seq-delta 1 下仍能继续的重新广播，正是把 0 以下的停止归因于 ack 的内容、而非仅归因于我方发送过内容的关键"
"Tera Type, 0 Normal to 17 Fairy in type order (default %(default)s)" = "太晶属性，按属性顺序从 0 一般 到 17 妖精（默认 %(default)s）"
"Union Room battle with --battle-fight: which of the active Pokemon's four move slots to use. The default 0 is whatever move slot one holds, which for the tracked party is refresh and does no damage" = "配合 --battle-fight 的联盟房间对战：使用出战宝可梦四个招式栏位中的哪一个。默认值 0 即第一个招式栏位，对受追踪的队伍而言是 Refresh，不造成伤害"
"Union Room battle: pick fight with the first move instead of forfeiting at the first action prompt. Only the forfeit path has been proven on hardware" = "联盟房间对战：在第一个行动提示处选择用第一个招式战斗，而不是认输。目前只有认输路径在实机上验证过"
"Union Room chat: a line to send once the chat opens, repeatable. Up to 15 Gen-3 charmap characters each, the console's own keyboard limit and the width its chat line can draw; they go out one at a time, 1.5s apart" = "联盟房间聊天：聊天开启后要发送的一行，可重复。每行最多 15 个第三世代字符映射表中的字符，即游戏机自身键盘的限制及其聊天行可绘制的宽度；它们逐条发出，间隔 1.5 秒"
"Union Room chat: tail this file while the host runs and send every line appended to it, so the chat can be answered live instead of queued at launch" = "联盟房间聊天：主机运行时持续跟踪这个文件，并发送追加到其中的每一行，这样聊天就能实时得到回应，而不必在启动时排队"
"Union Room trading board: register the offered Pokemon (its species and level) and ask for this type in return, so the console's board lists us. The console must have a Pokemon of that type to start the trade" = "联盟房间交换板：登记所提供的宝可梦（其物种和等级），并要求对方以此属性回赠，这样游戏机的交换板上就会列出我们。游戏机必须拥有该属性的宝可梦才能开始交换"
"Union Room: accept the console's 'Tchat' instead of declining it. Both sides send a join block, then the console's keyboard opens and every line it types is logged" = "联盟房间：接受游戏机的 ‘Tchat’ 而不是拒绝。双方各发一个加入块，随后游戏机的键盘会打开，它输入的每一行都会被记录"
"Union Room: accept the console's Combat instead of declining it. The console needs two non-egg party mons at level 30 or lower or it refuses on its own screen; it is master and runs the battle, we answer its controller commands" = "联盟房间：接受游戏机的对战（Combat）而不是拒绝。游戏机需要队伍里有两只看非蛋、等级 30 或以下的宝可梦，否则它会在自己的界面上拒绝；它是主机方并负责运行对战，我方回应它的手柄命令"
"Union Room: re-present a parent NI_START for N VBlanks before the first UNI frame; the room child drops the link after five unanswered frames, and enters UNI 480 frames after the last NI_START. 120 is proven" = "联盟房间：在第一个 UNI 帧之前，以父级 NI_START 重新呈现 N 个 VBlank；房间子进程在五帧无应答后丢弃链路，并在最后一个 NI_START 之后 480 帧进入 UNI。120 已验证"
"V-Blank ticks between re-sends of an unanswered Session join; 0 is once" = "对未获回应的会话加入的重发之间的 V-Blank 节拍数；0 表示只发一次"
"WHEN to open the selection phase with a 40050 pair on 0x7c port 1. \"offer\" sends it as soon as our offer is acknowledged, the only window the console is still reading in; \"migration\" sends it on the migration start, after the console has stopped. The pair is the same envelope as the console's own 40030 at offset 50 with our station id; the builder reproduces its 40030 pair byte for byte" = "何时用 40050 成对消息在 0x7c 端口 1 上开启选择阶段。「offer」在我方提议被确认后立即发送，这是游戏机仍在读取的唯一窗口；「migration」在迁移开始时发送，此时游戏机已经停止。该成对消息与游戏机自己的 40030 在偏移 50 处的信封相同，只是换用我方的 station id；构建器会逐字节复现其 40030 成对消息"
"Wi-Fi phy; explicit phyN overrides --adapter" = "Wi-Fi 物理层；显式给出 phyN 会覆盖 --adapter"
"Wild Area" = "旷野地带"
"Wonder Card flagId, 1000..1019; without this option, the selected gift's registered default shown below is used" = "神秘卡片 flagId，1000..1019；不给此选项时，使用下方显示的所选礼物已注册的默认值"
"Wonder News payload to distribute (Mystery Gift -> Wonder News -> Friend). Available news: pokeldn id 1: the plain proof-of-link news, one berry from the man in CERULEAN CITY berry id 2: a ten-line news that exercises the console's scroll indicator" = "要分发的 Wonder News 载荷（神秘礼物 -> Wonder News -> 朋友）。可用的 news：pokeldn id 1：纯朴的连线证明 news，CERULEAN CITY 那位男士给的一颗树果 berry id 2：一条十行的 news，用于检验游戏机的滚动指示器"
"`ping` content N's 10000-base holder at the 0x84 snapshot ack, before either side offers. The console's box send is gated on a ready bool at content+0x4c that only `0x010ce040` sets, on a zero result code; until then every command the game tries to send is parked in content+0x48. A parked command that does not match the next one sets the error byte +0x4d, and `0x010c9bb0` turns that into trade state 9: abort, with nothing on the application layer" = "在 0x84 快照 ack 时、任一方提议之前，`ping` 内容 N 的 10000 基持有者。游戏机的电脑盒发送受 content+0x4c 处一个 ready 布尔量控制，只有 `0x010ce040` 会在结果码为零时置位该布尔量；在此之前，游戏尝试发送的每个命令都停放在 content+0x48 中。停放的命令若与下一条不匹配，会置位错误字节 +0x4d，`0x010c9bb0` 将其转为交换状态 9：中止，应用层上什么也没有发生"
"a .pk8 to put in --offer-slot in place of the snapshot's record: stored or party form, encrypted or PKHeX's decrypted export. Its OT name and ids become the snapshot's unless --offer-file-as-is. Repeatable, one per trade on the session: the console's player picks again from the box; the last serves every later trade" = "放进 --offer-slot、用来替换快照记录的 .pk8：可以是存放形态或队伍形态，加密的或 PKHeX 导出的解密版本。除非指定 --offer-file-as-is，其初训家名称和 ID 会成为快照的初训家名称和 ID。可重复，会话中每次交换一个：游戏机上的玩家会从电脑盒里重新挑选；最后一个用于此后所有交换"
"a .pokegift or 720-byte .wc8 record to send instead of building one" = "要发送的 .pokegift 或 720 字节 .wc8 记录，而不是自行构建一个"
"a 3456-byte trade snapshot to send back on 0x84 once the console sends its own, or live (the default under --preset trade) for the console's own from this session. A short 2965-byte payload is inflated first. The identity is rewritten by --snapshot-name/-tid/-sid" = "要在 0x84 上回发的 3456 字节交换快照，等游戏机发出自己的快照后再发；或设为 live（--preset trade 下的默认值），使用本次会话中游戏机自己的快照。较短的 2965 字节载荷会先解压。身份由 --snapshot-name/-tid/-sid 重写"
"a 354-byte offer message to send once the streams are open. Repeatable, one per trade in the seat; the last serves every later trade" = "流打开后要发送的 354 字节提议消息。可重复，本座位中每次交换一个；最后一个会用于之后所有交换"
"a Dynamax Adventure (Max Lair) guest: the lobby, the paths and the battles; use with --scene 50000" = "极巨团体战（极巨巢穴）的访客：大厅、路线和战斗；配合 --scene 50000 使用"
"a Max Raid den guest: after the snapshot send PlayerInfo, BattleReady and SelectPokemon (the --offer-slot Pokemon); use with --scene 60006" = "极巨团体战巢穴的客人：在快照之后发送 PlayerInfo、BattleReady 与 SelectPokemon（--offer-slot 指定的宝可梦）；请配合 --scene 60006 使用"
"a PB8 to offer (328 or 344 bytes, encrypted or PKHeX's decrypted export), edited by --trade-nickname and --trade-ot. 328 bytes hold much more than this project has identified, so what we send is a real Pokemon with named fields changed rather than one invented from nothing. Repeatable, one per trade in order; the last is offered again after the list" = "用于提议的 PB8（328 或 344 字节，加密或 PKHeX 解密导出的均可），由 --trade-nickname 与 --trade-ot 修改。328 字节所包含的信息远超本项目已辨识的部分，因此我方发送的是改动过具名字段的真实宝可梦，而非凭空捏造的宝可梦。可重复，按顺序每次交换一个；列表用完后会再次提议最后一个"
"a PK8 to place in the offered party slot, encrypted or PKHeX export. Repeatable, one per trade: the player trades again from the box, or searches again; the last serves every later trade" = "要放入所提供队伍栏位的 PK8，加密格式或 PKHeX 导出均可。可重复，每次交换一个：玩家会从盒中再次交换，或重新搜索；最后一个会用于之后所有交换"
"a SECOND stream, on --send2-protocol, sent once the console says --send2-trigger. `60ea000012020801` is BlockDataHolder{imReady:true}, which the console says on 0x80 and waits on" = "第二条流，位于 --send2-protocol 上，在游戏机表示 --send2-trigger 后发送。`60ea000012020801` 是 BlockDataHolder{imReady:true}，游戏机在 0x80 上表示它并等待它"
"a comma-separated list of ids to probe instead" = "改用逗号分隔的 id 列表去探测"
"a complete FRLG .pokegift file, or a .wc3 Wonder Card" = "一个完整的 FRLG .pokegift 文件，或一张 .wc3 神秘卡片"
"a directory of NNN.bin records to send on 0x81 port 0 as this host's own identity, the way a pair's host sends its 46; the first carries INITIALIZED and every one is already zlib (scratchpad/sv_extract_records.py writes such a set); by default the recorded set in pokeldn.sv.reference" = "一个包含 NNN.bin 记录的目录，在 0x81 端口 0 上作为本主机自身身份发送，方式如同对局主机发送其 46；第一个携带 INITIALIZED，且每一个都已是 zlib（scratchpad/sv_extract_records.py 可写出这样一组）；默认使用 pokeldn.sv.reference 中录制好的那一组"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "在封存之前写入所提供记录的一个字段，按其在 pokeldn.sv.pokemon 中的名称指定：nickname=SHINY、species=906、ivs=31,31,31,31,31,31、trainer_id=12345、ball=4。可重复；单独使用 `shiny` 会按记录自身的 id 掷出一个异色的性格值"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "在提议的记录被封存之前写入其中的字段，按其 pokeldn.sv.pokemon 名称指定：nickname=SHINY、species=906、level=50、ivs=31,31,31,31,31,31、pid=0x1234、trainer_id=12345、ball=4、moves=33,0,0,0。可重复；单独使用 `shiny` 会针对记录自身的 id 随机生成异色的性格值"
"a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "保存本主机所提议的 348 字节记录的文件（原始二进制或十六进制文本；352 字节的游戏消息会先去掉其头部）。给出它后，主机会用自己的记录回应游戏机的提议、予以确认，并像成对交换中的主机那样跟随游戏机走完提交与四个交换步骤（pokeldn.sv.trade）。可重复：第二条及之后的记录在同一栏位上提供，每完成一场交换提供一条"
"a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "保存本加入方所提议的 348 字节记录的文件（原始二进制或十六进制文本；352 字节的游戏消息会先去掉其头部）。给出它后，加入方会用自己的记录回应主机的提议、予以确认、提交，并像成对交换中的加入方那样回应四个交换步骤（pokeldn.sv.trade）。可重复：第二条及之后的记录在同一栏位上提供，每完成一场交换提供一条"
"a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon" = "把游戏机自己的提议写入的文件，内容为其 80 00 02 00 消息的 348 字节主体，以十六进制文本保存。其内容由 pokeldn.sv.pokemon 读取"
"a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text" = "用于写入主机自身提议内容的文件，即其 80 00 02 00 消息的 348 字节正文，以十六进制文本保存"
"a file to write the moment a seat forms and again when it ends, so a watcher on the other side can act on the seat without a relay" = "座位形成的那一刻写入、并在其结束时再次写入的文件，好让另一侧的监视器无需中继即可对座位采取行动"
"a game message to put on the reliable stream before the first --request-ids request, e.g. 0x59:01000100 to add station 1 to the console's match-wait list. Repeatable, sent in order" = "在第一次 --request-ids 请求之前放到可靠流上的游戏消息，例如 0x59:01000100 用于把站点 1 加入游戏机的 match-wait 列表。可重复，按顺序发送"
"a protocol id the console does not register, so its version is 0" = "一个游戏机不注册的协议 id，因此其版本为 0"
"a reward row in place of the seed's, in order; up to 45" = "用来替代种子自带奖励行的一行奖励，按顺序给出；最多 45 行"
"a reward row, item id and count; up to 15; none gives an emulated den's rows" = "一行奖励，物品 id 与数量；最多 15 行；不给则使用模拟巢穴的奖励行"
"a ribbon index; repeatable" = "一个缎带索引；可重复"
"a searching console put both of its measured sessions on channel 6" = "一台搜索中的游戏机把它的两个实测会话都放在信道 6 上"
"a standard or a black (six-star) crystal" = "一颗普通结晶或一颗黑色（六星）结晶"
"ability slot, 2 the hidden ability (default 0 or 1 at random, as a wild one's)" = "特性槽位，2 为隐藏特性（默认在 0 或 1 中随机，与野生宝可梦一样）"
"ability-capsule" = "ability-capsule"
"accept hardware-decrypted RX frames that retain their CCMP header and mic (TP-Link Archer T3U/rtw88_8822bu profile)" = "接受保留其 CCMP 头与 mic 的硬件解密 RX 帧（TP-Link Archer T3U/rtw88_8822bu 配置）"
"accept without waiting for the joiner's acceptance, as a player would; for our own joiner, which accepts after its partner" = "像玩家那样，不等加入方的接受就先行接受；本项用于我方的加入方，它在伙伴之后才接受"
"ack one past the highest id received, with no mask, instead of the contiguous run and a mask as a retail station does (docs/sv.md)" = "不像零售站点那样确认连续段加掩码，而是确认收到最高 id 的下一个且不带掩码（docs/sv.md）"
"ack the mesh join response, on the STATION protocol" = "在 STATION 协议上确认网格加入响应"
"acknowledge a record already held at most once per SECONDS per stream; a new record is acked at once. 0 acks every repeat (docs/sv.md)" = "对已持有的记录，每条流每 SECONDS 秒最多确认一次；新记录则立即确认。0 表示每次重复都确认（docs/sv.md）"
"acknowledge the 0x7C reliable window. The pass signal is the retransmits STOPPING and the sequence ids moving on" = "确认 0x7C 可靠窗口。通过信号是重传「停止」且序列号继续前进"
"acknowledge the console's reliable data as it arrives" = "在游戏机的可靠数据到达时予以确认"
"act as the player too: offer once the host shows, confirm once it offers, then selector 7; without it the console's player leads" = "同时也扮演玩家：主机一出现就提议，主机一提议就确认，然后选择器 7；不启用则由游戏机的玩家主导"
"address our datagrams to the host rather than to the broadcast" = "把我们的数据报发往主机，而不是发往广播地址"
"address our datagrams to the link-local broadcast, as a retail station does" = "把我们的数据报发往链路本地广播地址，如同零售 station 所为"
"address our own clone announce to the peer alone. A real joiner addresses the first announce of a clone to the whole mesh (dest 0x0003), which is the default here" = "把我方的克隆宣布只发给伙伴。真实的加入方会把某个克隆的首次宣布发给整个网格（dest 0x0003），此处默认即是如此"
"advertise 0x00, hex; a searching Sword joins only a larger one than its own; default 0xFFFF and two random bytes" = "通告 0x00，十六进制；正在搜索的《剑》只会加入比自身值更大的网络；默认为 0xFFFF 加两个随机字节"
"advertise Violet's local communication id instead of Scarlet's" = "通告《紫》的本地通信 id，而不是《朱》的"
"advertise this local communication id" = "广播这个本地通信 id"
"after THEY answer our approach, send this message - the initiator's own next one. `0x06:0000000000` is NetDataTalkData{sexId 0, CHECK}, which is what SwitchTalkStateMine builds. Repeatable, sent in order" = "在对方回应我们的接近之后，发送这条消息——发起方自己的下一条。`0x06:0000000000` 是 NetDataTalkData{sexId 0, CHECK}，正是 SwitchTalkStateMine 所构建的内容。可重复，按顺序发送"
"after answering an RPC pair, send BOTH members again with the clock advanced by this much. The console advances its own pair's clock by 2 each burst (b41c, b61c, b81c). A repeated clock is a repeated state, so an answer that carries one clock never moves ours. 0 is off" = "回应一个 RPC 对之后，将时钟推进这么多，再发送两个成员。游戏机每次突发会把其自身对的时钟推进 2（b41c、b61c、b81c）。重复的时钟即重复的状态，因此只携带一个时钟的回应永远不会推动我方的状态。0 表示关闭"
"after answering phase 3, wait for the console's phase 6, then leave without answering it; this deliberately triggers the game's trade restriction" = "回应阶段 3 之后，等待游戏机的阶段 6，然后不作回应就离开；这会故意触发游戏的交换限制"
"after answering the talk reservation, send this game message on the reliable stream - `0x08:00` is NetDataSelectData{index: 0}. Repeatable, sent in order. The console parks in TalkState GREETING and waits to be advanced, and which message does it is not readable offline: this is the sweep handle" = "回应交谈预约之后，在可靠流上发送这条游戏消息——`0x08:00` 即 NetDataSelectData{index: 0}。可重复，按顺序发送。游戏机会停在 TalkState GREETING 等待被推进，而究竟哪条消息能推进它无法离线判读：这就是用于扫描的入口"
"after identifying, vary the variable id to find what result 7 tests" = "识别之后，改变变量 ID，以找出 result 7 所检验的内容"
"after our offer is acknowledged, send `ping` on content N's 10000-base holder for each N - `382700000a00` for 40, which is exactly the opener nxldn-lab's client sends to start the confirmation phase, rebuilt here from our own content registry rather than copied" = "我方提议被确认后，对每个 N 在内容 N 的 10000 基持有者上发送 `ping`——40 对应 `382700000a00`，这正是 nxldn-lab 的客户端为开始确认阶段所发送的开场消息，此处依据我方自己的内容注册表重建，而非照抄"
"after our offer is acknowledged, send boxSyncStateCommand{data:N} on the trade holder for each N in turn, one per acknowledged sequence. 20030 is a BoxSyncStateDataHolder and its field 2 is a command enum; this project 1 offers and 2 withdraws; 4 confirms and 5 withdraws the confirmation" = "我方提议被确认后，在交换持有者上依次为每个 N 发送 boxSyncStateCommand{data:N}，每个已确认的序列发送一次。20030 是一个 BoxSyncStateDataHolder，其字段 2 是命令枚举；本项目 1 表示提议、2 表示撤回；4 表示确认、5 表示撤回确认"
"after our offer is acknowledged, send imReady on the TRADE holder (20030). The console has never sent these bytes and the published client waits for them before it offers, so it may be our turn to say them" = "我方提议被确认后，在 TRADE 持有者（20030）上发送 imReady。游戏机从未发送过这些字节，而已公开的客户端在它提议之前会等待这些字节，所以也许该由我们来说它们"
"after the CONFIRMATION content answers our syncCommand with a hash, re-arm the 40040 pair and send BOTH members again at this clock delta - the move --selection-final-delta makes on 40050, which carries the selection phase past its own hash" = "在 CONFIRMATION 内容用一个 hash 回应了我们的 syncCommand 之后，重新装填 40040 对，并在此 clock delta 上把两个成员都再发一次——这正是 --selection-final-delta 在 40050 上做的动作，它让选择阶段越过自己的 hash"
"after the ack, sweep the version-4 connection request on protocol 0x14" = "在 ack 之后，在协议 0x14 上扫描版本 4 的连接请求"
"after the count, read each candidate protocol's registered version" = "计数之后，读取每个候选协议所注册的版本"
"after the join, sweep the bulk acknowledgement until the console's reliable retransmission stops" = "加入之后持续扫描批量确认，直到游戏机的可靠重传停止"
"after the reliable handshake, send N position messages of our own and watch the console's screen" = "可靠握手之后，发送 N 条我方自己的位置消息，并观察游戏机的画面"
"after the response, send a type-5 station-list update (sets job+0x7c). Its per-station layout is provisional pending the 0x739050 decode" = "在响应之后发送类型 5 的站点列表更新（设置 job+0x7c）。其每站点布局在 0x739050 解码完成前是暂定的"
"after the seat, send this 1395-byte identity record on 0x81 port 1 (our station stream) as the game's data exchange, retransmitting until the host acknowledges it. A retail joiner sends its own identity here" = "座位建立后，在 0x81 端口 1（我们的站点流）上发送这条 1395 字节的身份记录，作为游戏的数据交换，并重传直到主机确认它。零售版加入方也是在这里发送自己的身份"
"after the selection HASH is answered, send the 40050 pair AGAIN - both members - at this clock delta. nxldn-lab's `selection_final_delta` is 9 (nxldn-lab's `selection_final_delta`). --rpc-pair latches per envelope, so the second pair needs the latch cleared. 0 is off" = "选择 HASH 被回应之后，在这个时钟差值处再一次发送 40050 对——两个成员都发。nxldn-lab 的 `selection_final_delta` 为 9（nxldn-lab 的 `selection_final_delta`）。--rpc-pair 按 envelope 锁定，所以第二次发送这一对需要先清除锁定。0 表示关闭"
"after the station handshake closes, send the Mesh Protocol (0x18) join request and ack whatever comes back" = "站点握手关闭之后，发送网格协议（0x18）加入请求，并对返回的任何内容发送 ack"
"after the station handshake, send up to N mesh join requests" = "站点握手之后，最多发送 N 个 mesh 加入请求"
"after the walk, send a NetDataTranerCardData for our own station. It is the message that says what a player LOOKS like, and the probe is whether the character the game drew for us changes on screen" = "走完流程后，为我们自己的站点发送一个 NetDataTranerCardData。这条消息描述的是一名玩家“长什么样”，而探测目的是看游戏为我们绘制的角色是否会在屏幕上发生变化"
"after the walk, send a NetRequestData for each of these data ids, one at a time on the reliable stream, and print what comes back. The Union Room answers six ids (docs/bdsp_protocol.md); 0x22 is the opaque one" = "走完流程后，对这里列出的每个 data id 各发一个 NetRequestData，在可靠流上一次一个，并打印收到的回应。联盟房间会回应六个 id（docs/bdsp_protocol.md）；0x22 是其中含义不明的那一个"
"ageto-celebi" = "ageto-celebi"
"all" = "全部"
"allow a save write outside struct SaveBlock2's never-read filler regions. This is the player's live save and the console commits it to flash; without this the write is refused" = "允许写入 SaveBlock2 结构体中从未被读取的填充区域之外的存档内容。这是玩家的实时存档，游戏机会把它提交到 flash；不启用则写入会被拒绝"
"also send a station list in the same breath as the join response, under this sequence id; an emulated Scarlet host sends one with id 0 there and the second about two seconds later" = "在发送加入响应的同时顺带发送一份站点列表，使用这个序列 id；模拟的《朱》主机会在那里发一个 id 为 0 的，约两秒后再发第二个"
"also send an RTT request, which a peer answers with no state at all" = "同时发送一个 RTT 请求，对端回应它时完全不带状态"
"altering-cave" = "altering-cave"
"an NPC partner the raid seats, in slot order, one per slot the consoles leave empty (2 with one console, 1 with two, none with three): Austin, Ava, Logan, Hailey, Evan, Charlotte, Kylie, Hunter, Gianna, Eli, Henry, Chase, Claire, Brooklyn, Zoe, Samantha, Dylan, Luke; the host draws a partner seed that seats them, the rest drawn freely (docs/sv_raid.md, Partners)" = "团体战安排入座的 NPC 伙伴，按栏位顺序，每个被游戏机空出的栏位安排一位（一台游戏机时空出 2 个，两台时 1 个，三台时没有）：Austin、Ava、Logan、Hailey、Evan、Charlotte、Kylie、Hunter、Gianna、Eli、Henry、Chase、Claire、Brooklyn、Zoe、Samantha、Dylan、Luke；主机会抽取一个伙伴种子来安排它们，其余则自由抽取（docs/sv_raid.md, Partners）"
"an encrypted party PK8 sent as our rental instead of the offered one" = "作为我方租借宝可梦发送的加密队伍 PK8，而不是所提供的那只"
"anchors" = "anchors"
"announce our own channel table on 0x7c. A station opens the game's channel by sending the same 31-byte table its peer sends on port 1, an open on port 2, and a mirror of every later table update; the peer sends the game on port 0 only once ours is announced (docs/sv.md)" = "在 0x7c 上宣告我们自己的频道表。站点开启游戏频道的方式是：发送与其对端在端口 1 上发送的相同的 31 字节表、在端口 2 上发送一个 open，并镜像此后每一次表更新；只有在我方的表被宣告之后，对端才会在端口 0 上发送游戏数据 (docs/sv.md)"
"answer NetDataTradeReadyOkData (0x21) with tradeState=WAIT and LET THE TRADE COMPLETE. THIS WRITES THE CONSOLE'S SAVE: the message is the only writer of the console's `targetTradeState`, both states at WAIT move UnionTradeManager to SECURIY_TRADE, and TradeStateModel$$InitState calls PlayerSave. The Pokemon the player picked leaves their box and ours takes its place. Needs --trade-reply. ASK THE USER FIRST" = "以 tradeState=WAIT 回应 NetDataTradeReadyOkData (0x21)，并让交换完成。这会写入游戏机的存档：该消息是游戏机 `targetTradeState` 的唯一写入者，两个状态都处于 WAIT 会把 UnionTradeManager 移到 SECURIY_TRADE，而 TradeStateModel$$InitState 会调用 PlayerSave。玩家选中的宝可梦会离开其电脑盒，由我方的宝可梦占据该位置。需要 --trade-reply。请先询问用户"
"answer a NetDataTalkReserveData with a NetDataTalkReserveResultData. unanswered, the player's character freezes" = "用 NetDataTalkReserveResultData 回应 NetDataTalkReserveData。若无回应，玩家的角色会卡住"
"answer a connection request the CONSOLE sends us with a connection response" = "用连接响应来应答游戏机主动发给我们的连接请求"
"answer a peer re-announcement with an acknowledgement carrying its clock rather than a second take-over. A reference joiner takes a clone over once and never again" = "对端重新宣告时，用一条携带其时钟的确认来回应，而不是第二次接管。参考加入方只接管克隆一次，之后不再接管"
"answer clone clock requests, if any" = "回应克隆时钟请求（如果有）"
"answer each RTT request SECONDS late; RTT samples enable the host's retransmission timer (docs/sv.md)" = "对每条 RTT 请求都延迟 SECONDS 秒再回应；RTT 样本会启用主机的重传计时器 (docs/sv.md)"
"answer each payload the console sends ONCE instead of re-deriving an answer to its last payload every period. `said` never clears, so without this an offer goes out hundreds of times. The console sends each of its own messages once" = "对游戏机发送的每个载荷只回应一次，而不是每个周期都针对其最后一个载荷重新推导回应。`said` 从不清除，因此若不启用此项，一个提议会被发送数百次。游戏机自身每条消息也只发送一次"
"answer every DISTINCT (envelope, base, field-5 body) in the 40000 band once, on top of the opening pair. The clock advances on every message so the payload cannot be the key, but the body can: `00000000` and `000018fc` are the openers and anything else is new. A per-envelope guard stops answering at the hash body and stalls there" = "对 40000 段内每一个不同的（envelope、base、字段 5 主体）各回应一次，此外还包括开场那一对。时钟在每条消息上都会推进，所以载荷不能作为键，但主体可以：`00000000` 与 `000018fc` 是开场值，其他任何值都算新值。每个 envelope 的守卫会在哈希主体处停止回应并卡在那里"
"answer only the first of a peer's repeated publishes with a copy of our own and acknowledge the rest. Measured to stop the peer publishing at all, so the default answers each one" = "对端重复发布时，只用我们自己的一份回应第一次，其余仅做确认。实测这会让对端完全不发布，所以默认对每一次都做回应"
"answer the confirmation content's four-byte steps with phase N in the LOW u16 instead of echoing the console's own. The console reads its phase out of exactly those bytes (`0x006d6490` stores them, `0x006d3260` reads them), and every step this project has sent so far echoed the value back unchanged" = "用把阶段 N 放在低位 u16 中的方式回应确认内容的四字节步骤，而不是回显游戏机自己的值。游戏机正是从这几个字节中读出其阶段（`0x006d6490` 存储它们，`0x006d3260` 读取它们），而本项目迄今发送的每一步都是把该值原样回显"
"answer the console's 0x58 RTT requests. Sixteen bytes at version 4, and the reply echoes the seven bytes nothing has read yet" = "回应游戏机的 0x58 RTT 请求。版本 4 时为十六字节，且回应会回送那七个尚未被读取的字节"
"answer the console's 40030 RPC as the PAIR it is: collect both members one per base, 10000 then 20000, keyed on the BASE FIELD. `payload[5] in (0x19, 0x1A)` is the inner length and moves with the sender's station-id varint (0x1A/0x1B on some consoles). Send both once in that order and nothing more on this window; `said_by_port` keeps only the last payload, so a mirror sends one member repeatedly and never the other" = "以「成对」的形式回应游戏机的 40030 RPC：按 BASE FIELD 收集两个成员，各对应一个 base，先 10000 后 20000。`payload[5] in (0x19, 0x1A)` 是内部长度，会随发送方的 station-id varint 变化（某些游戏机上为 0x1A/0x1B）。在该窗口内按此顺序各发送一次，不要再发其他内容；`said_by_port` 只保留最后一个载荷，因此镜像方会反复发送一个成员，而永远不发另一个"
"answer the console's MIGRATION_START on 0x18 port 1 with a MIGRATION_RESPONSE. `440001` arrives there only when the player accepts, and the console goes silent on every window afterwards: the last thing it asks for is two bytes of mesh, not application data" = "用 MIGRATION_RESPONSE 回应游戏机在 0x18 端口 1 上的 MIGRATION_START。只有玩家接受时 `440001` 才会到达那里，此后游戏机在每个窗口上都保持沉默：它最后索要的是两个字节的 mesh，而不是应用数据"
"answer the console's NetDataReturnSelectData, a round reset, ONCE; the answer has no measured effect" = "只回应一次游戏机的 NetDataReturnSelectData（一次回合重置）；该回应没有测到任何实际效果"
"answer the console's NetRequestData with the message it names. It has asked for data id 0x23 in every capture since the first join and has never been answered; this is the probe, so arm it on its own" = "用游戏机请求中所指定的消息回应它的 NetRequestData。从第一次加入起的每次抓包里它都请求 data id 0x23，却从未得到回应；这就是该探测项，请单独启用它"
"answer the console's RTT requests (protocol 0x58) while we hold the seat" = "在我们持有该栏位期间回应游戏机的 RTT 请求（协议 0x58）"
"answer the console's clone-clock (0x77) with a host clock message; the console's ClockProtocol is parked in state 4 and an inbound clock message resets its state machine (report 157)" = "用一条 host clock 消息回应游戏机的 clone-clock（0x77）；游戏机的 ClockProtocol 停在状态 4，而一条入站时钟消息会重置它的状态机（report 157）"
"answer the console's offer with this 232-byte box structure (echo: its own back), and its commits with commits" = "用这个 232 字节的电脑盒结构回应游戏机的提议（echo：回显它自己的那条），并用 commits 回应它的各次提交"
"answer the console's request for NetDataIsMatchWaitData (0x23) with isMatchWait=1 instead of 0. ONE comparison in UnionRoomManager$$SetNetData gates the trade on it (`cmp w23, #1` at main.bin 0x01fd56e4, then UnionFrontDeskTradeController$$StartMatch); every run has answered 0, which is a station declining to be matched" = "用 isMatchWait=1 而不是 0 来回应游戏机对 NetDataIsMatchWaitData (0x23) 的请求。UnionRoomManager$$SetNetData 中只有一处比较据此决定是否放行交换（main.bin 0x01fd56e4 处的 `cmp w23, #1`，随后是 UnionFrontDeskTradeController$$StartMatch）；此前每次运行回的都是 0，也就是站点拒绝被匹配"
"answer the console's trade messages with ours. It sends a trainer record and then a Pokemon and waits; with neither answered the player sits on \"En attente d'une reponse\". THIS DOES NOT COMPLETE A TRADE - the player still confirms on their own screen, and declining there leaves the save untouched" = "用我方的消息回应游戏机的交换消息。它会先发送一条训练家记录，然后发送一只宝可梦，然后等待；两者都未得到回应时，玩家会停在「En attente d'une reponse」。这并不会完成一次交换——玩家仍要在自己的屏幕上确认，若在那里拒绝，存档保持不变"
"answer the host's Net 0x11 with the 0x12 ack. A retail joiner does not, and the ack makes the console ask for host migration instead (sv08)" = "用 0x12 ack 回应主机的 Net 0x11。零售加入方不会这样做，而该 ack 会让游戏机转而请求主机迁移 (sv08)"
"answer the host's offers with a box structure of our own. 'echo' returns the host's own, which the game accepts by construction; a path is a 232-byte structure, encrypted or not. Repeatable, one per trade on the seat; trade N writes what it received to --received with -N. After the last, a further trade is not answered and the player backs out" = "用我方自己的电脑盒结构来回应主机的提议。'echo' 会原样返回主机自己的结构，游戏从构造上就会接受；路径则指向 232 字节的结构，加密与否均可。可重复，该席位上的每次交换一个；第 N 次交换会把收到的内容写到带 -N 后缀的 --received。最后一次之后，再来的交换不会得到回应，玩家会退出"
"answer the host's type-7 leave-with-host-migration with a type-8 ack, telling it we accept the host role it is handing over" = "用 type-8 ack 回应主机的 type-7「带主机迁移离开」，告知我方接受它正在移交的主机角色"
"answer the ready-ok, after which the console writes its save" = "回应 ready-ok，之后游戏机会写入其存档"
"answer the trade RPC on its OWN Pia port with its own reliable window. The console sends them on 0x7C port 1; an answer on port 0 lands on a window it does not read them on" = "在交换 RPC 自己的 Pia 端口上、用它自己的可靠窗口来回应。游戏机在 0x7C 端口 1 上发送它们；在端口 0 上回应会落到它不读取这些内容的窗口上"
"answer with `pokeldn.swsh.trade.SYNC_ANSWERS` instead of echoing one payload: the ping, and the three other sync holders the console is expected to raise after the trade snapshot. A payload with no rule is REPORTED and left unanswered - that report is the point of the run" = "用 `pokeldn.swsh.trade.SYNC_ANSWERS` 回应，而不是回显某一个载荷：包括 ping，以及交换快照之后预期由游戏机发起的另外三个同步持有者。没有对应规则的载荷会被报告且不作答复——该报告正是此次运行的目的"
"answered clock requests of our own before the participate (measured 10)" = "在我方参与之前，由我方回应的时钟请求数量（实测为 10）"
"any other record field by name: shiny_type=3, ball=1, held_item=236, gender=1, nature=10, ability_type=2, iv_hp=31, dynamax_level=10, gigantamax=1, tid=12345, sid=54321 ..." = "按名称指定其他任意记录字段：shiny_type=3, ball=1, held_item=236, gender=1, nature=10, ability_type=2, iv_hp=31, dynamax_level=10, gigantamax=1, tid=12345, sid=54321 ..."
"append completed joined-attempt records to daily csv files in DIR; default: disabled (the supervised shell host enables logs/)" = "把完成的加入尝试记录追加到 DIR 下按日分割的 csv 文件；默认：禁用（受监管的 shell 主机会启用 logs/）"
"append what the console says about itself - its card counters, its four questionnaire words and its Easy Chat battle profile - to this jsonl ledger. tools/frlg/game_data_read.py reads it back and says what moved between sessions" = "把游戏机关于自身的说明——它的卡片计数器、它的四个问卷词以及它的 Easy Chat 对战档案——追加到这个 jsonl 台账中。tools/frlg/game_data_read.py 会把它读回，并说明两次会话之间有哪些变化"
