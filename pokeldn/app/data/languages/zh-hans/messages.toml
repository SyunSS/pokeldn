"end a seat on which the console has sent nothing at all for this many seconds, and go back to scanning. An association taken outside the console's host phase carries no traffic; without this the run holds it for the whole --hold" = "在该秒数内游戏机完全没有发送任何东西时结束这个座位，并返回扫描。在游戏机的主机阶段之外建立的关联不携带任何流量；没有这一项，运行会在整个 --hold 期间一直持有它"
