"units one position message spans. The default is what a console's own walk measures (0.93 units every 0.41 s, over 80 of its messages); our first walks did 0.15 every 0.6 s, which is a ninth of a real player's speed and is the whole of the stutter" = "一条位置消息所跨越的单位数。默认值取自游戏机自身行走的实测（在其 80 条消息中，每 0.41 秒 0.93 单位）；我方最初的行走是每 0.6 秒 0.15，仅为真实玩家速度的九分之一，这正是卡顿的全部来源"
"unown-letters" = "unown-letters"
"update-ack" = "update-ack"
"use FireRed's session-wide incrementing Pia nonce" = "使用火红在整个会话内递增的 Pia nonce"
"use Pia-backed send-once block delivery (recommended); --no-trust-pia enables diagnostic RFU retransmits" = "使用由 Pia 支撑的 send-once 块投递（推荐）；--no-trust-pia 启用用于诊断的 RFU 重传"
"values for byte [0x10]" = "字节 [0x10] 的取值"
"values for byte [1], list or LO-HI" = "字节 [1] 的取值，列表或 LO-HI 形式"
"values for the MESSAGE flags byte. 0x09 is what the console puts on its own Local Protocol messages; BDSP's station requests carry 0x11" = "MESSAGE 标志字节的取值。0x09 是游戏机在自己 Local Protocol 消息上所用的值；BDSP 的站点请求携带 0x11"
"values for the header byte at 0x05 on the requests, and their IV source id; list or LO-HI" = "请求中 0x05 处头部字节的取值，以及它们的个体值来源 id；可列出或写作 LO-HI"
"values for the platform byte at [2]. 9 is the real one; ANY other value is answered with a connection response rather than dropped, which is the probe for whether our message reaches the 0x14 handler at all" = "平台字节（位于 [2]）的取值。9 是真实值；其他任何值都会得到连接响应而不是被丢弃，这正是用来探测我方消息究竟能否到达 0x14 处理器的探针"
"violet" = "紫"
"visiting-trainer" = "visiting-trainer"
"wait for this payload on --send2-protocol before sending; omit to send as soon as the mesh is up" = "在 --send2-protocol 上等待到这个载荷后再发送；省略则在网格一建立就发送"
"water" = "水"
"what a console that does not know the phrase reads (max 63 characters); the default is 'That is not the phrase.'" = "不认识该短语的游戏机会读到什么（最多 63 个字符）；默认是 'That is not the phrase.'"
"what to send when the console migrates the mesh. \"auto\" sends MIGRATION_FINISH when the start names US as the next host and a MIGRATION_RESPONSE when it names anyone else, which is what the binary says. \"response\" always answers 0x48, for comparison" = "游戏机迁移网络时要发送什么。「auto」在迁移开始时指定我方为下一任主机则发送 MIGRATION_FINISH，指定其他任何一方则发送 MIGRATION_RESPONSE，这正是该二进制程序的行为。「response」则始终回应 0x48，用于对照"
"when the CONFIRMATION envelope (40040) sends a four-byte status whose body ends `0100` - the same cue the selection content sends before its Pokemon - reply with SyncSaveDataHolder{syncCommand{data:N}} on that content's 10000-base holder, id 10040, reliable port 0, and answer the status itself on port 1. Content 40 takes a command and not a Pokemon: its parser 0x010df6d0 accepts one submessage carrying one int32. Its own machine sends 0, 1, 2 and 3 in that order (swsh_trade.SYNC_COMMANDS)" = "当 CONFIRMATION 信封（40040）发出一个四字节状态、其正文以 `0100` 结尾时——这与选择内容在发送其宝可梦之前发出的提示相同——在该内容基于 10000 的持有者（id 10040，可靠端口 0）上以 SyncSaveDataHolder{syncCommand{data:N}} 回应，并在端口 1 上回应状态本身。内容 40 接收的是命令而非宝可梦：其解析器 0x010df6d0 接受一条携带一个 int32 的子消息。其自身的机器按该顺序发送 0、1、2 和 3（swsh_trade.SYNC_COMMANDS）"
"when the console follows its selection-phase Pokemon with the status whose body ends `0100`, offer OUR Pokemon on that content's 10000-base holder (id 10050) on reliable port 0 and answer the status on port 1" = "当游戏机在其选择阶段的宝可梦之后跟发正文以 `0100` 结尾的状态时，在该内容基于 10000 的持有者（id 10050）上、可靠端口 0 上提议我方的宝可梦，并在端口 1 上回应状态"
"when the console hands us the host role before the announcement (not a player leaving), leave its network and become the host with bin/sv_host.py on the same channel and code, as bin/pla_join.py does; needs --answer-migration" = "当游戏机在通告之前把主机角色交给我们（而不是有玩家离开）时，离开它的网络并用 bin/sv_host.py 在同一信道和连接码下成为主机，做法与 bin/pla_join.py 相同；需要 --answer-migration"
"when the console hands us the host role, leave its network and become the host with bin/pla_host.py on the same code and channel" = "当游戏机把主机角色交给我们时，离开它的网络，并用同一套代码和信道上的 bin/pla_host.py 成为主机"
"when the console sends game message ID, answer once with the body in FILE (raw bytes, no header): 0x15:capsule.bin answers its ball capsule with ours, 0x14:record.bin its record" = "当游戏机发送游戏消息 ID 时，用 FILE 中的主体（原始字节，无头部）回应一次：0x15:capsule.bin 用我们的球壳回应它的球壳，0x14:record.bin 回应它的记录"
"when the hosting console leaves, ack its update session carrying the host-migration state and leave the network on its START_HOST_MIGRATION, as its own clients do; each step waits 10 s unanswered" = "当担任主机的游戏机离开时，确认它携带主机迁移状态的更新会话，并像它自己的客户端那样在其 START_HOST_MIGRATION 时离开网络；每一步在无人应答时等待 10 秒"
"where identity10.bin, identity11b.bin and selection.bin live; by default the ones pokeldn.za.reference ships" = "identity10.bin、identity11b.bin 和 selection.bin 所在的位置；默认使用 pokeldn.za.reference 自带的那几个"
"where our character spawns relative to the console's own, on x. The default +2.0 is one fixed side, and a player standing against the wall on that side gets a character spawned out of bounds (followed by a crash). Negative puts it on the other side" = "我方角色相对于游戏机自身角色的生成位置，按 x 轴。默认的 +2.0 是一侧固定偏移，若玩家正好贴墙站在这侧，生成的角色会出界（随后崩溃）。取负值则放到另一侧"
"where our character stands: x,y,z,rot_y (a retail host's own spot)" = "我方角色所在位置：x,y,z,rot_y（零售主机自身所在的位置）"
"where the reference payloads (identity10.bin, selection.bin, ...) live; by default the ones pokeldn.za.reference ships" = "参照载荷（identity10.bin、selection.bin 等）所在的位置；默认使用 pokeldn.za.reference 随附的那一组"
"where to write the Pokemon the console offers; trade N > 1 writes FILE-N" = "在哪里写入游戏机所提议的宝可梦；第 N 次交换（N > 1）会写入 FILE-N"
"which SyncPingDataHolder field --sync-after-hash sends: 1 ping, 2 pingReply, 3 pingSynced (`780000001a00`, the one the trace records)" = "--sync-after-hash 发送 SyncPingDataHolder 的哪个字段：1 ping、2 pingReply、3 pingSynced（`780000001a00`，即跟踪记录中的那个）"
"which activity --union-room advertises; default 'in-room', the bare IN_UNION_ROOM a console standing in the room connects to. 'search' is what the screen before the room looks for (untested)" = "--union-room 宣告的是哪种活动；默认 'in-room'，即站在房间里的游戏机所连接的裸 IN_UNION_ROOM。'search' 是进入房间之前的界面所查找的（未测试）"
"which map group the RAM script binds to (a group_order index in [decomp:data/maps/map_groups.json]). The default is the player's house, where the mother never moves. Cerulean Cave B1F is group 1 map 74, and MEWTWO is object 3." = "RAM 脚本绑定到哪个地图组（[decomp:data/maps/map_groups.json] 中的一个 group_order 索引）。默认是玩家自己的家，那里的母亲角色从不移动。华蓝洞窟 B1F 是组 1 地图 74，MEWTWO 是对象 3。"
"which map in that group the RAM script binds to." = "该组中的哪个地图供 RAM 脚本绑定。"
"which object event on that map. Local ids are assigned in map.json order and start at 1. Binding REPLACES that object's own script, so choose one that never moves." = "该地图上的哪个对象事件。本地 id 按 map.json 的顺序分配，从 1 开始。绑定会替换该对象自己的脚本，因此请选择一个从不移动的对象。"
"which of the 32 ack slots to fill; \"all\" (the default) fills every one, because only the slot at some station index is read and whose index it is has not been settled. \"0\" is the console, \"1\" is us" = "要填充 32 个 ack 栏位中的哪一个；「all」（默认）会全部填充，因为只会读取某个站点索引处的栏位，而它究竟是哪个索引尚未确定。「0」是游戏机，「1」是我方"
"which party slot of --send-snapshot to offer back, 1-6; 0 offers nothing and only records what the console offers us" = "要回赠 --send-snapshot 的哪个队伍栏位，1-6；0 表示不回赠任何东西，只记录游戏机向我们提议的内容"
"whose addresses a hook, a stub or a ROM call is built with: BPRF, BPGF, BPRE, BPGE, BPRS, BPGS, BPRD, BPGD, BPRI, BPGI, BPRJ, BPGJ. auto (the default) builds for each and sends the one the console's game code names, before anything address-dependent is sent; another code is refused. A game code serves only that cartridge. Bytes with no build address go to any console either way" = "用于构建 hook、stub 或 ROM 调用的地址所对应的游戏代码：BPRF、BPGF、BPRE、BPGE、BPRS、BPGS、BPRD、BPGD、BPRI、BPGI、BPRJ、BPGJ。auto（默认）为每个代码分别构建，并在发送任何依赖地址的内容之前，发送游戏机自身游戏代码所指明的那个；其它代码会被拒绝。一个游戏代码只适用于对应的卡带。没有构建地址的字节在任一情况下都会发往任意游戏机"
"whose constant and variable id go in the response's two id fields - a deduction, so 'both' alternates them across the retransmits" = "响应的两个 ID 字段中放谁的常量 ID 和变量 ID——这只是推断，所以 'both' 会在各次重传中交替它们"
"wifi phy for the LDN join (live)" = "用于 LDN 加入的 wifi phy（实机）"
"wire mpId / gLocalLinkPlayerId (joiner = 1 = right seat; the only valid value - mpId 0 is the host/parent) [trade.c:1816; link_rfu_2.c:1633-1638]" = "写入 mpId / gLocalLinkPlayerId（加入方 = 1 = 右侧席位；唯一合法值——mpId 0 是主机/父级）[trade.c:1816; link_rfu_2.c:1633-1638]"
"wish-egg" = "wish-egg"
"with --buffer-script call-chain: one step, repeatable, up to 16, run in order in one frame. `call:NAME_OR_ADDR[,ARG]...` calls a ROM function (AddBagItem, AddMoney, AddPCItem, CalcCRC16, CheckBagHasItem, CheckBagHasSpace, CompactPartySlots, CreateMon, FlagClear, FlagGet, FlagSet, GetMoney, GetSetPokedexFlag, GetVarPointer, IncrementGameStat, InitRamScript, IsEnoughMoney, ItemIsMail, Random, ReadFlash, RemoveBagItem, RemoveMoney, RunScriptImmediately, SeedRng, SpeciesToNationalPokedexNum, StringCompare, VarGet, VarSet, or a THUMB address); `read32|read16|read8:ADDR` reads; `write32|write16|write8:ADDR,VALUE` writes and reads itself back, and needs --write-unsafe. A target of `prev` is the PREVIOUS step's result and `prev+N` is N bytes past it, which is how a function that returns a pointer becomes a write; an op may carry +keep to leave prev alone. Example: --chain-step call:GetVarPointer,0x4024 --chain-step write16:prev,7. A named function is resolved on the console's build" = "配合 --buffer-script call-chain：一步操作，可重复，最多 16 个，在同一帧内按顺序运行。`call:NAME_OR_ADDR[,ARG]...` 调用一个 ROM 函数（AddBagItem、AddMoney、AddPCItem、CalcCRC16、CheckBagHasItem、CheckBagHasSpace、CompactPartySlots、CreateMon、FlagClear、FlagGet、FlagSet、GetMoney、GetSetPokedexFlag、GetVarPointer、IncrementGameStat、InitRamScript、IsEnoughMoney、ItemIsMail、Random、ReadFlash、RemoveBagItem、RemoveMoney、RunScriptImmediately、SeedRng、SpeciesToNationalPokedexNum、StringCompare、VarGet、VarSet，或一个 THUMB 地址）；`read32|read16|read8:ADDR` 读取；`write32|write16|write8:ADDR,VALUE` 写入并回读自身，且需要 --write-unsafe。目标写 `prev` 表示上一步的结果，`prev+N` 表示其后的 N 个字节，返回指针的函数正是由此变成一次写入；一个操作可以带 +keep 以保持 prev 不变。示例：--chain-step call:GetVarPointer,0x4024 --chain-step write16:prev,7。具名函数按游戏机的 build 解析"
"with --buffer-script call: one argument word, repeatable, up to eight. The first four go in r0..r3 and the rest on the stack at [sp+0..12], where CreateMon's own prologue reads them" = "配合 --buffer-script call：一个参数字，可重复，最多八个。前四个放入 r0..r3，其余放在栈上的 [sp+0..12]，CreateMon 自身的序言正是从这里读取它们"
"with --buffer-script call: one word read immediately before and immediately after the call, both returned. gRngValue is 0x03004220 French, 0x030042D0 English. For a function that returns nothing, such as SeedRng, this is the only evidence the call did what it was called for" = "配合 --buffer-script call：在调用之前和之后各立即读取一个字，两者都会返回。gRngValue 在法语版为 0x03004220、英语版为 0x030042D0。对于不返回任何值的函数（如 SeedRng），这是证明该调用确实达成其目的的唯一证据"
"with --buffer-script call: the ROM function to call, as a THUMB pointer (bit 0 set). SeedRng is 0x080486D1 and Random 0x080486B1 on the French cartridges, 0x08048691 and 0x08048671 on the English ones [builds.py]. The address is sent as given, so pair it with --console-build. 0 calls nothing, which checks the send path with the ROM left out" = "配合 --buffer-script call：要调用的 ROM 函数，以 THUMB 指针表示（置位第 0 位）。在法语卡带上 SeedRng 为 0x080486D1、Random 为 0x080486B1，在英语卡带上为 0x08048691 和 0x08048671 [builds.py]。地址按原样发送，因此需与 --console-build 配合使用。0 表示不调用任何函数，用于在不涉及 ROM 的情况下检验发送路径"
"with --buffer-script create-mon --create-mon-ot-id-type 1: the OT id to use" = "配合 --buffer-script create-mon --create-mon-ot-id-type 1：要使用的初训家 id"
"with --buffer-script create-mon: 0 = the OT is the player and the id comes off the real save, 1 = use --create-mon-ot-id, 2 = rolled until not shiny" = "配合 --buffer-script create-mon：0 = 初训家为玩家且 ID 取自真实存档，1 = 使用 --create-mon-ot-id，2 = 反复随机直到不是异色"
"with --buffer-script create-mon: append the finished mon to the player's party. The slot is computed from gSaveBlock1Ptr, never given, and it is always the first free one - playerParty[playerPartyCount] - so an occupied slot is never touched and no Pokemon can be destroyed. A full party writes nothing and says so. This is the player's live SAVE and the console commits it to flash: needs --write-unsafe" = "配合 --buffer-script create-mon：把生成好的宝可梦追加到玩家队伍中。栏位由 gSaveBlock1Ptr 计算得出，从不直接指定，且总是第一个空位——playerParty[playerPartyCount]——因此已占用的栏位绝不会被触碰，也不会有任何宝可梦被销毁。队伍已满时不写入任何内容，并会说明这一点。这是玩家的实际存档，游戏机会把它提交到闪存：需要 --write-unsafe"
"with --buffer-script create-mon: copy the finished 100 bytes to this address in the console's memory. The mon is built in our own image either way, so without this nothing on the console is written at all. Needs --write-unsafe" = "配合 --buffer-script create-mon：把生成好的 100 字节复制到游戏机内存中的该地址。无论如何，宝可梦都是在我方自己镜像中构建的，因此不指定此项则完全不会写入游戏机上的任何内容。需要 --write-unsafe"
"with --buffer-script create-mon: every IV set to this, 0..31. 32 or more rolls them instead [USE_RANDOM_IVS], which makes the run non-deterministic" = "配合 --buffer-script create-mon：把每一项个体值都设为该值，0..31。32 或更大则会改为随机抽取 [USE_RANDOM_IVS]，这会使此次运行变得不确定"
"with --buffer-script create-mon: the 32-bit personality value, which fixes the nature, the gender, the ability slot and, with the trainer ids, whether the mon is shiny. Omitted, the console rolls one with Random32" = "配合 --buffer-script create-mon：32 位性格值，它决定性格、性别、特性槽，并与训练家 id 一起决定该宝可梦是否异色。省略时游戏机会用 Random32 掷一个"
"with --buffer-script create-mon: the ROM function to call with eight arguments, a THUMB pointer. The default is the console build's CreateMon (0x08041151 French, 0x080411FD English); 0 calls nothing, which checks the send path with the ROM left out" = "配合 --buffer-script create-mon：以八个参数调用的 ROM 函数，是一个 THUMB 指针。默认值为游戏机版本中的 CreateMon（法文 0x08041151，英文 0x080411FD）；0 表示不调用任何东西，用于在不涉及 ROM 的情况下检查发送路径"
"with --buffer-script create-mon: the level, 1..100" = "配合 --buffer-script create-mon：等级，1..100"
"with --buffer-script create-mon: the same run as --create-mon-append - the same call, the same arithmetic on the same gSaveBlock1Ptr - with the two stores that would change the save left out. It reports the party count and the address it would have written, and reads that slot's current 100 bytes back so the answer says what a real run would overwrite. Writes nothing, so it needs no override" = "配合 --buffer-script create-mon：与 --create-mon-append 相同的运行——相同的调用、对同一个 gSaveBlock1Ptr 的相同运算——只是省略了那两处会改变存档的写入。它会报告队伍数量与原本会写入的地址，并读回该栏位当前的 100 字节，以便答案说明真实运行会覆盖什么。不写入任何内容，因此无需 override"
"with --buffer-script create-mon: the species number, 1..411 (internal numbering, not the National Dex)" = "配合 --buffer-script create-mon：物种编号，1..411（内部编号，不是全国图鉴编号）"
"with --buffer-script flash-patch: byte offset of the field inside the sector's data" = "配合 --buffer-script flash-patch：该字段在该扇区数据中的字节偏移"
"with --buffer-script flash-patch: the replacement bytes for that field, as hex. Everything else in the sector is whatever the game's own save routine wrote" = "配合 --buffer-script flash-patch：该字段的替换字节，以十六进制表示。扇区内的其他所有内容都保持游戏自身存档例程所写入的样子"
"with --buffer-script flash-read: byte offset into the sector to start reading at" = "配合 --buffer-script flash-read：从该扇区中开始读取的字节偏移"
"with --buffer-script flash-write: added to each word of the pattern" = "配合 --buffer-script flash-write：加到模式的每个字上"
"with --buffer-script flash-write: compose a WELL-FORMED save sector instead of a raw pattern - the console zeroes past the data, computes the game's own checksum over the 3968-byte data area and lays down id, checksum, signature and counter" = "配合 --buffer-script flash-write：构造一个格式正确的存档扇区，而不是原始字节模式——游戏机会把数据之后的部分清零，按 3968 字节的数据区计算游戏自身的校验和，并写入 id、校验和、签名与计数器"
"with --buffer-script flash-write: how many words of the sector to compose" = "配合 --buffer-script flash-write：要组成该扇区的多少个字"
"with --buffer-script flash-write: the 4 KB flash sector (0..31) swi 0x48 writes. Sectors 0..27 are the two save bands and need --write-unsafe; 28..31 are outside both" = "配合 --buffer-script flash-write：swi 0x48 要写入的 4 KB flash 扇区（0..31）。扇区 0..27 是两个存档带，需要 --write-unsafe；28..31 在两个带之外"
"with --buffer-script flash-write: word[0] of the pattern the console composes" = "配合 --buffer-script flash-write：游戏机构造的模式中的 word[0]"
"with --buffer-script install-resident: a hook parameter, e.g. extra=6" = "配合 --buffer-script install-resident：一个钩子参数，例如 extra=6"
"with --buffer-script install-resident: the hook to install (turbo)" = "配合 --buffer-script install-resident：要安装的钩子（turbo）"
"with --buffer-script memory-dump-multi: how many consecutive blocks to pull in ONE session. MG_LINK_BUFFER_SIZE caps a message, not a session, so the client script runs the payload once per block and each pass sends the next one" = "配合 --buffer-script memory-dump-multi：在单次会话中连续拉取多少个块。MG_LINK_BUFFER_SIZE 限制的是一条消息，而不是一次会话，因此客户端脚本对每个块各运行一次载荷，每次执行发送下一个块"
"with --buffer-script memory-dump-scatter: the UNRELATED addresses to read, one block each, in this order. A plan asks for scattered kilobytes rather than one long region, and this is the payload that answers it. Accepts 0x hex" = "配合 --buffer-script memory-dump-scatter：要读取的互不相关的地址，每个地址一个块，按此顺序。计划要求的是分散的若干千字节，而不是一整段长区域，而这个载荷就是用来应答它的。接受 0x 十六进制"
"with --buffer-script memory-dump: how many bytes to read, 1..1024 (MG_LINK_BUFFER_SIZE)" = "配合 --buffer-script memory-dump：要读取多少字节，1..1024 (MG_LINK_BUFFER_SIZE)"
"with --buffer-script memory-dump: the console address to read out (0x02000000 EWRAM, 0x03000000 IWRAM, 0x08000000 ROM). Accepts 0x hex" = "配合 --buffer-script memory-dump：要读取的游戏机地址（0x02000000 EWRAM、0x03000000 IWRAM、0x08000000 ROM）。接受 0x 十六进制"
"with --buffer-script memory-scan: 32-byte blocks scanned per frame, the budget the console's link has to live with (default 512, about 3 ms of a 16 ms frame)" = "配合 --buffer-script memory-scan：每帧扫描的 32 字节块数，即游戏机链路必须承受的预算（默认 512，约相当于 16 ms 帧中的 3 ms）"
"with --buffer-script memory-scan: one past the last address to read (default 0x09000000, the end of a 16 MB cartridge)" = "配合 --buffer-script memory-scan：要读取的最后一个地址的下一个地址（默认 0x09000000，即 16 MB 卡带的末尾）"
"with --buffer-script memory-scan: the 32-bit value to search for. The payload returns 0 to be called again next frame, so one run scans a whole range instead of the 1024 bytes a dump reads. Accepts 0x hex" = "配合 --buffer-script memory-scan：要搜索的 32 位值。载荷返回 0 表示下一帧再次调用，因此一次运行可以扫描整个范围，而不像 dump 那样只读 1024 字节。接受 0x 十六进制"
"with --buffer-script memory-scan: the watchdog. A payload that never returns 1 hangs the Mystery Gift menu, so the scan gives up and answers after this many frames (default: what the range needs, plus two)" = "配合 --buffer-script memory-scan：看门狗。始终不返回 1 的载荷会挂住神秘礼物菜单，因此扫描在这么多帧之后放弃并作答（默认：该范围所需帧数再加两帧）"
"with --buffer-script memory-scan: where to start, 32-byte aligned (default 0x08000000, the cartridge)" = "配合 --buffer-script memory-scan：起始位置，按 32 字节对齐（默认 0x08000000，即卡带）"
"with --buffer-script rng-trace: a ROM function to call between the two reads of each sample, as a THUMB pointer (bit 0 set), or 0 for none. Random is 0x080486B1 French, 0x08048671 English; the recurrence between the two reads is then the proof that both addresses are what we say they are" = "配合 --buffer-script rng-trace：在每个样本的两次读取之间要调用的 ROM 函数，以 THUMB 指针表示（置位第 0 位），或 0 表示不调用。Random 在法语版为 0x080486B1、英语版为 0x08048671；两次读取之间的递推关系即可证明这两个地址确实如我们所说"
"with --buffer-script rng-trace: how many frames to sample, 1..96" = "配合 --buffer-script rng-trace：要采样的帧数，1..96"
"with --buffer-script rng-trace: the word to sample once a frame. gRngValue is 0x03004220 on the French cartridges and 0x030042D0 on the English ones [builds.py]. Accepts 0x hex" = "配合 --buffer-script rng-trace：每帧采样的那个字。gRngValue 在法文卡带上为 0x03004220，在英文卡带上为 0x030042D0 [builds.py]。接受 0x 十六进制"
"with --buffer-script rom-checksum: 32-byte chunks summed per frame (default 512, no more load on the frame than memory-scan's 512)" = "配合 --buffer-script rom-checksum：每帧求和的 32 字节块数量（默认 512，对帧造成的负载不超过 memory-scan 的 512）"
"with --buffer-script rom-checksum: one past the last address to sum, a whole number of blocks after --sum-start (default 0x09000000)" = "配合 --buffer-script rom-checksum：求和范围最后一个地址的下一个地址，相对 --sum-start 为整数个块（默认 0x09000000）"
"with --buffer-script rom-checksum: the ROM image to compare the sums with (default: the image config.REFERENCE_ROMS names for the console's build)" = "配合 --buffer-script rom-checksum：用于比对各校验和的 ROM 映像（默认：config.REFERENCE_ROMS 中为游戏机构建所命名的映像）"
"with --buffer-script rom-checksum: the block size, a power of two from 32; the range holds at most 128 blocks (default 0x20000)" = "配合 --buffer-script rom-checksum：块大小，从 32 起的 2 的幂；范围内最多容纳 128 个块（默认 0x20000）"
"with --buffer-script rom-checksum: the watchdog, in calls (= frames) (default: what the range needs, plus two)" = "配合 --buffer-script rom-checksum：看门狗，以调用次数（= 帧）计（默认：范围所需数量再加二）"
"with --buffer-script rom-checksum: where to start, aligned to --sum-block (default 0x08000000, the cartridge)" = "配合 --buffer-script rom-checksum：起始位置，需按 --sum-block 对齐（默认 0x08000000，即卡带）"
"with --buffer-script save-dump: byte offset into that block. Accepts 0x hex" = "配合 --buffer-script save-dump：进入该块的字节偏移。接受 0x 十六进制"
"with --buffer-script save-dump: which save block to read; sav2 is name, trainer id and pokedex, sav1 is party, bag, money, flags and vars" = "配合 --buffer-script save-dump：要读取哪个存档块；sav2 是名字、训练家 id 和图鉴，sav1 是队伍、背包、金钱、标志和变量"
"with --buffer-script save-write: ascii to write into the save block at --dump-offset. The same region is read back in the same run, so the answer is the proof. The console saves afterwards, so it reaches flash" = "配合 --buffer-script save-write：写入 --dump-offset 处存档块的 ascii 内容。同一区域会在同一次运行中被读回，因此回传结果本身就是证据。游戏机随后会存档，因此它落到 flash"
"with --buffer-script save-write: the bytes to write, as hex" = "配合 --buffer-script save-write：要写入的字节，以十六进制表示"
"with --buffer-script sloop-svc: a syscall, 0x40..0x62 (0x4D is the bad-word check); repeat for up to eight, issued in order in one session" = "配合 --buffer-script sloop-svc：一个系统调用，0x40..0x62（0x4D 是 bad-word 检查）；可重复最多八次，在一个会话中按顺序发出"
"with --buffer-script sloop-svc: issue THUMB `bkpt N` instead of `swi N` (0xFF is the one the game never issues; needs --write-unsafe)" = "配合 --buffer-script sloop-svc：改为发出 THUMB 的 `bkpt N` 而不是 `swi N`（0xFF 是游戏从不发出的那个；需要 --write-unsafe）"
"with --buffer-script sloop-svc: point this register at the console's copy of the data" = "配合 --buffer-script sloop-svc：让此寄存器指向游戏机上该数据的副本"
"with --buffer-script sloop-svc: r0, r1, r2, r3 in order (repeatable)" = "配合 --buffer-script sloop-svc：依次为 r0、r1、r2、r3（可重复）"
"with --buffer-script sloop-svc: the data as hex instead" = "配合 --buffer-script sloop-svc：改用十六进制给出数据"
"with --buffer-script sloop-svc: up to 256 bytes of UTF-8 data to send" = "配合 --buffer-script sloop-svc：最多 256 字节的 UTF-8 数据用于发送"
"with --buffer-script string-gather: bytes from one pointer to the next (default 12, struct EasyChatWordInfo, whose `text` is at offset 0; a plain array of `const u8 *` is 4)" = "配合 --buffer-script string-gather：从一个指针到下一个指针之间的字节数（默认 12，对应结构体 EasyChatWordInfo，其 `text` 位于偏移 0；纯 `const u8 *` 数组则为 4）"
"with --buffer-script string-gather: how many pointers to follow at most" = "配合 --buffer-script string-gather：最多跟随多少个指针"
"with --buffer-script string-gather: longest string accepted, terminator included. A pointer that is not a string would otherwise be copied until it met an 0xFF (default 64)" = "配合 --buffer-script string-gather：可接受的最长字符串，含终止符。否则一个并非指向字符串的指针会被一直拷贝，直到遇到 0xFF（默认 64）"
"with --buffer-script string-gather: the address of the first pointer in an array to follow. The answer is the strings themselves, back to back, so one run carries a whole table instead of a window of mostly-pointers. Accepts 0x hex" = "配合 --buffer-script string-gather：要追踪的指针数组中第一个指针的地址。返回结果就是这些字符串本身，首尾相接，因此一次运行就能带回整张表，而不是一个以指针为主的窗口。接受 0x 十六进制"
"with --buffer-script table-scan: 16-byte blocks scanned per frame (default 192, the same instruction load on the frame that memory-scan's 512 costs)" = "配合 --buffer-script table-scan：每帧扫描的 16 字节块数（默认 192，与 memory-scan 的 512 给该帧带来的指令负载相同）"
"with --buffer-script table-scan: how many words in a row make a run worth reporting (default 12, the twelve gSpecialVar_0x8000..0x800B entries)" = "配合 --buffer-script table-scan：连续多少个字才值得报告（默认 12，即十二个 gSpecialVar_0x8000..0x800B 条目）"
"with --buffer-script table-scan: one past the last address to read (default 0x09000000)" = "配合 --buffer-script table-scan：要读取的最后一个地址的下一个（默认 0x09000000）"
"with --buffer-script table-scan: the watchdog, in calls (= frames)" = "配合 --buffer-script table-scan：看门狗，以调用次数计（= 帧数）"
"with --buffer-script table-scan: what each word of the run must exceed the one before it by. 2 finds a table of pointers to consecutive u16s, which is what gSpecialVars is. Accepts 0x hex" = "配合 --buffer-script table-scan：连续每个字必须比前一个字大多少。2 用于查找指向连续 u16 的指针表，gSpecialVars 正是如此。接受 0x 十六进制"
"with --buffer-script table-scan: where to start, 16-byte aligned (default 0x08000000, the cartridge)" = "配合 --buffer-script table-scan：起始位置，按 16 字节对齐（默认 0x08000000，即卡带）"
"with --flash-derive: added to gSaveCounter for the footer. 0 keeps the sector in its own band; a positive value is what would outrank the live slot" = "配合 --flash-derive：加到页脚的 gSaveCounter 上。0 使该扇区保留在其自身带内；正值则会使它排在活动槽位之上"
"with --flash-derive: aim at band position N (0..13) and derive the ID from it, instead of deriving the position from --flash-id. Position 13 is the sector whose counter GetSaveValidStatus reports for the whole slot" = "配合 --flash-derive：瞄准 band 位置 N（0..13）并由它推导出 ID，而不是由 --flash-id 推导位置。位置 13 是 GetSaveValidStatus 为整个存档槽上报其计数器的那个扇区"
"with --flash-footer: read gLastWrittenSector and gSaveCounter on the console and write the sector the --flash-id actually occupies right now, rather than a position computed when the payload was built. Needs --write-unsafe" = "配合 --flash-footer：在游戏机上读取 gLastWrittenSector 和 gSaveCounter，写入 --flash-id 此刻实际占据的扇区，而不是在构建载荷时算出的位置。需要 --write-unsafe"
"with --flash-footer: the save counter written at +0xFFC" = "配合 --flash-footer：写入 +0xFFC 处的存档计数器"
"with --flash-footer: the sector id written at +0xFF4" = "配合 --flash-footer：写入 +0xFF4 处的扇区 id"
"with --gift event-pokemon: a fresh copy of a Gen 3 distribution, made by PKHeX by that event's own PID/IV method, e.g. \"WISHMKR Jirachi\", \"10 ANIV Pikachu\", \"Aura Mew\". The release in --language is preferred. Without it the card sends a stored WISHMKR Jirachi." = "配合 --gift event-pokemon：该第三代配信的一次全新副本，由 PKHeX 按该活动自身的 PID/IV 方法产生，例如「WISHMKR Jirachi」「10 ANIV Pikachu」「Aura Mew」。优先使用 --language 指定的版本。未指定时，卡片发送存档中的一只 WISHMKR Jirachi。"
"with --gift rng-mon-hunt: a floor under one IV, repeatable (speed=31, attack=20). The stats are hp, attack, defense, speed, sp_attack, sp_defense, named in the order the ROM draws them - which is not the order the summary screen shows." = "配合 --gift rng-mon-hunt：某一项个体值的下限，可重复（speed=31, attack=20）。各项为 hp、attack、defense、speed、sp_attack、sp_defense，命名顺序即 ROM 抽取的顺序——与能力摘要画面显示的顺序不同。"
"with --gift rng-mon-hunt: how long the search may block the overworld in the worst case, in frames (default 900, about 15 s). The field engine has not returned while it searches, so the player sees a still frame with the music playing; criteria whose search could take longer than this are refused before the card is built." = "配合 --gift rng-mon-hunt：最坏情况下搜索可以阻塞旷野地带多久，以帧为单位（默认 900，约 15 秒）。搜索期间对战引擎不会返回，因此玩家看到的是画面静止、音乐继续播放；若某项条件的搜索可能超过这个时长，会在构建卡片之前被拒绝。"
"with --gift rng-mon-hunt: how many states the stub may try before giving up and leaving the rng alone. The default is the smallest cap that finds one 99 times in 100." = "配合 --gift rng-mon-hunt：桩代码在放弃并不再动 RNG 之前可以尝试多少个状态。默认值是能在 100 次中有 99 次找到一只的最小上限。"
"with --gift rng-mon-hunt: the level that species appears at." = "配合 --gift rng-mon-hunt：该物种出现时的等级。"
"with --gift rng-mon-hunt: what the stub's own `setwildbattle` puts on the screen. Neither the species nor the level is drawn from the rng, so this changes nothing about the search. The default is a level 5 MAGIKARP, which is catchable in one ball." = "配合 --gift rng-mon-hunt：桩代码自己的 `setwildbattle` 在画面上显示什么。物种和等级都不取自 RNG，因此这对搜索结果没有任何影响。默认是一只 5 级的 MAGIKARP，一个球就能捉到。"
"with --gift rng-mon-hunt: which natures the search will accept, comma separated (Hardy, Lonely, Brave, Adamant, Naughty, Bold, ...), or plain ids. Without this it takes any." = "配合 --gift rng-mon-hunt：搜索会接受哪些性格，以逗号分隔（Hardy、Lonely、Brave、Adamant、Naughty、Bold 等），或直接给 id。不指定则接受任意性格。"
"with --ip-host, the address to advertise" = "配合 --ip-host 时，要宣告的地址"
"with --ip-host, the address to advertise and serve on" = "配合 --ip-host，用于通告并提供服务的地址"
"with --match-wait, ALSO send NetDataIsMatchWaitData{1} every S seconds for the whole hold (0 disables, leaving the answer-on-request). The console requests 0x23 once, at t=8.4-9.4, and the player reaches the trade option in the Y menu long after that" = "配合 --match-wait，在整个保持期间每 S 秒额外发送一次 NetDataIsMatchWaitData{1}（0 为禁用，只保留按请求回应）。游戏机只在 t=8.4-9.4 请求一次 0x23，而玩家要到很久之后才会在 Y 菜单里点到交换选项"
"with --migrate, ladder done to box command 3 and the migration" = "配合 --migrate，阶梯已完成到电脑盒命令 3 与迁移"
"with --raid-event: roll each drop's chance as a den does, or give every drop" = "配合 --raid-event：像巢穴那样为每个掉落物掷概率，或者直接给出每个掉落物"
"with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)" = "配合 --raid-event：把只能捕捉一次的遭遇（所有七星团体战、Walking Wake、Iron Leaves 等）作为普通捕捉来提供，其捕获率取正常值，其记录编号使用没有任何存档捕捉过的替代编号，因此已捕捉过它的存档可以再次捕捉；无法被捕捉的仍保持无法捕捉 (docs/sv_raid.md, Event raids)"
"with --raid-event: the boss, numbered as the list printed without it" = "配合 --raid-event：Boss，其编号与不带该选项时打印的列表一致"
"with --raid-event: the den area whose table the boss comes from" = "配合 --raid-event：Boss 所出自的巢穴区域"
"with --raid-event: the star rank, 1 to 5" = "配合 --raid-event：星级，1 到 5"
"with --raid-event: whose table the boss comes from; the advertisement's version by default" = "配合 --raid-event：头目来自哪个表；默认使用宣告中的版本"
"with --save-backup: keep a backup the link cut short here; the next one goes on from it" = "配合 --save-backup：保留因链路在此中断而未完成的备份；下一次会从它继续"
"with --selection-offer, answer the console's selection status with our PK8 in field 5 (`body`) of a 40050 Data carrying OUR ownerId, on the RPC port, instead of a PokemonTradeDataHolder on 10050 port 0. Content 50's receive handler resolves the sender to a station index and drops silently when it cannot; the holder shape carries no owner" = "配合 --selection-offer，改用携带我方 ownerId 的 40050 Data 的第 5 个字段（`body`）放入我方 PK8，在 RPC 端口上回应游戏机的选择状态，而不再在 10050 端口 0 上使用 PokemonTradeDataHolder。内容 50 的接收处理器会把发送方解析为站点索引，解析不到时会静默丢弃；持有者形式不携带 owner"
"with --selection-offer, answer the selection status with our PK8 as a PokemonTradeDataHolder on the 20000-base holder (id 20050), which is where the BOX phase's own Pokemon rides one content over. Overrides --selection-offer-mirror and --selection-offer-data" = "配合 --selection-offer，把我们的 PK8 作为 PokemonTradeDataHolder 放在以 20000 为基址的持有者上（id 20050）来回应选择状态，BOX 阶段自己的宝可梦正是放在比它大一号的 content 上。覆盖 --selection-offer-mirror 与 --selection-offer-data"
"with --selection-offer, answer the selection status with our PK8 in a 40050 carrying the console's OWN field set - syncId, clock, body, and neither elementId nor ownerId, which is how its own selection offer decodes. Overrides --selection-offer-data" = "配合 --selection-offer，用一个携带游戏机自己那套字段的 40050、以我方的 PK8 回应选择状态——syncId、clock、body，且既无 elementId 也无 ownerId，这正是它自己的选择提议的解码方式。会覆盖 --selection-offer-data"
"with --session-join, re-send it every N seconds (0 sends it once)" = "配合 --session-join，每 N 秒重发一次（0 表示只发送一次）"
"with --spawn: spawn only while the host stands in an area where PKHeX accepts that spawn caught, found from the wild Pokemon the host's console shares (it shares them once our player is near: --follow-host)" = "配合 --spawn：仅在主机所处区域被 PKHeX 认定为该生成点可捕捉时才生成，该区域由主机游戏机分享的野生宝可梦确定（一旦我方玩家靠近它就会分享：--follow-host）"
"with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP" = "配合 --union-circle 使用，在完成该任务后我方玩家离开圈子并结束运行：snacksworth 为所有 Snacksworth 传说宝可梦把主机缺失的 Team 与单人通关全部补上，从开始演示结束起每秒一个；bp 表示一次通关，给主机发放 --bbq-clear 点 BP"
"with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it" = "配合 --union-circle：在集友圈的启动演示结束后 10 秒，让 3 只该物种（dev 编号）的野生宝可梦停留在距主机玩家 15 到 25 米处，如同游戏机分享其自身的野生宝可梦：被主机战斗、移除，或主机离其超过 50 米时，它会再次出现在附近"
"with --union-circle: our player copies the host's as it moves, its animations and its ride, keeping 5 m from it and facing it" = "配合 --union-circle：我方玩家会跟随主机的移动、其动画和其坐骑一同复制，与它保持 5 米距离并面向它"
"with --union-circle: print each circle message we send and each step of the area search too; the --capture file keeps the steps either way" = "配合 --union-circle：同时打印我们发送的每条集友圈消息和区域搜索的每一步；无论如何 --capture 文件都会保留这些步骤"
"with a dumping --buffer-script: write the bytes that come back to this file" = "配合会转储数据的 --buffer-script：把返回的字节写入此文件"
"worlds-xp" = "worlds-xp"
"write an annotated listing for the exact Mystery Gift bytes that will be sent (default: disabled)" = "为将要发送的确切神秘礼物字节写一份带注释的清单（默认：禁用）"
"write every datagram here as JSON lines" = "把每个数据报以 JSON 行写入此处"
"write every record the console showed or offered to this directory" = "把游戏机展示或提议过的每条记录写入此目录"
"write every record the console shows or offers to this directory, one file per distinct record, named by species and nickname" = "把游戏机显示或提供的每条记录写入这个目录，每条不同记录一个文件，以物种和昵称命名"
"write the .sav FILE onto the console: beside its newest save, every sector read back, then the game loads it and saves; anything short of that keeps the old save" = "把 .sav 文件 FILE 写入游戏机：放在它最新存档旁边，每个扇区都回读校验，然后由游戏加载并保存；只要达不到这一步，就保留旧存档"
"write the PK8 the console offers to this file; trade N > 1 writes FILE-N" = "把游戏机提供的 PK8 写入此文件；第 N 次交换（N > 1）会写入 FILE-N"
"write the PK8 we will offer to this file, before the radio is touched" = "在触及无线电之前，把我们要提供的 PK8 写入此文件"
"write the Pokemon the console offers in trade N to PREFIX_N.pb8" = "把游戏机在第 N 次交换中提供的宝可梦写入 PREFIX_N.pb8"
"write the Pokemon the console picks here; trade N > 1 writes FILE-N. A preview, the console's cursor on its box, is not written" = "把游戏机所选的宝可梦写到此处；第 N 次交换（N > 1）会写入 FILE-N。预览，即游戏机在其电脑盒上的光标所指，不会被写入"
"write the host's offered PA9 here; trade N > 1 writes FILE-N" = "把主机提供的 PA9 写到此处；第 N 次交换（N > 1）写入 FILE-N"
"write the joiner's Pokemon here; trade N > 1 writes FILE-N" = "把加入方的宝可梦写到此处；第 N 次交换（N > 1）会写入 FILE-N"
"write the offered record's 348-byte body to this file as hex and exit, which needs no radio" = "把所提供记录的 348 字节主体以十六进制写入此文件并退出，此过程不需要无线电"
"write the peer's offered PB7 here" = "把对端提供的 PB7 写到这里"
"write the record and its fragments here and exit" = "把记录及其分片写到此处并退出"
"write the record the console traded to this file" = "把游戏机所交换的记录写入此文件"
"write the record the console traded to this file, -N before the extension for trade N above 1" = "把游戏机交换来的记录写入该文件，第 1 场以上的交换 N 在扩展名之前加 -N"
"zero" = "zero"
"zstd-compress out payloads" = "对发出的载荷做 zstd 压缩"
