"make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)" = "让每张 --gift-event 卡片在交换过程中按游戏机的存档重新生成「收礼者自己的初训家」：游戏机先提议，若它提议的是其存档捉到的宝可梦，则由该宝可梦指明训练家，我方的卡片也按此生成；若是其他情况，则采用游戏机会话数据指明的训练家。两者都不成立时，按原样提供，使用设置中的训练家（pokeldn.receiver_gift, docs/gift_simulated.md）"
