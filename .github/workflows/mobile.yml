name: Mobile

# Builds the Android and iOS apps on demand, without the ESP-IDF firmware images and the desktop
# bundles that Release builds first: examples/android/stage.py copies whichever images gui/firmware
# holds and works when it is empty, and an Android build with no release key signs with the debug key
# (examples/android/build.gradle). Download the APK and the IPA from the run's artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            gui/requirements.txt
      # examples/android/build_native.py compiles PKHeX (services/pkhex) and Unicorn for arm64-v8a.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # AGP 8.13 runs on Gradle 8.13 to 9.5 (examples/android/build.py).
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.1"
      - name: Install
        run: python -m pip install -r gui/requirements.txt
      # build_native.py compiles the Unicorn source this fetches.
      - name: Fetch the Unicorn source
        run: python scripts/build_unicorn.py
      - name: The release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "POKELDN_ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          GRADLE: gradle
          POKELDN_ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          POKELDN_ANDROID_VERSION_CODE: ${{ github.run_number }}
          POKELDN_ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          python examples/android/build.py --release
          cp examples/android/build/outputs/apk/release/pokeldn-release.apk pokeldn-android-arm64.apk
      - uses: actions/upload-artifact@v7
        with:
          name: pokeldn-android-arm64.apk
          path: pokeldn-android-arm64.apk

  # The iOS app (examples/ios/README.md): unsigned, for AltStore or SideStore to sign on the phone.
  ios:
    # Xcode 26 or later: actool compiles the Icon Composer icon (examples/ios/AppIcon.icon).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # PKHeX compiled ahead of time for iOS (services/pkhex/Library.cs).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install setuptools wheel
          python examples/ios/build.py --device
          cp examples/ios/build/pokeldn-ios.ipa pokeldn-ios.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: pokeldn-ios.ipa
          path: pokeldn-ios.ipa
